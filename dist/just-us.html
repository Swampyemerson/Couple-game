<title>Just Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Schibsted+Grotesk:wght@400..900&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════════════
   Just Us: the paper for two. The whole app is printed in the game room's Riso inks
   (the palette lives in games.css): Blue for Emerson, Fluorescent Pink for Sydney,
   Yellow for "look here", and a black key plate that carries the type and outlines.
   Dark mode is the same job on black card stock. The Spicy tab is printed after dark,
   with the pink ink leading. Inks belong to people; the key plate is the brand.
   ════════════════════════════════════════════════════════════════════════ */
:root {
  --bg: var(--g-bg);
  --bg2: var(--g-bg);
  --card: var(--g-card);
  --text: var(--g-ink);
  --muted: var(--g-muted);
  --line: var(--g-line);
  --accent: var(--g-ink);
  --accent2: var(--g-hl);
  --accent-soft: var(--g-hl-soft);
  --ok: var(--g-good);
  --no: var(--g-bad);
  --hot: var(--p-b);
  --hot2: var(--p-b-soft);
  --rule: color-mix(in srgb, var(--g-ink) 28%, transparent);
  --shadow: 3px 3px 0 var(--g-edge);
  --radius: 12px;
  --tabbar-h: 68px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --rule: color-mix(in srgb, var(--g-ink) 24%, transparent);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --rule: color-mix(in srgb, var(--g-ink) 24%, transparent);
  color-scheme: dark;
}
/* After dark: black stock in either theme, pink leading, shadows printed in a deep pink plate. */
body.spicy-mode {
  --p-a: #3fa7f5; --p-b: #ff5cb8; --p-a-soft: #11304a; --p-b-soft: #431a33; --p-a-text: #6dbbf7; --p-b-text: #ff7cc6;
  --g-bg: #141317; --g-card: #1f1e24; --g-ink: #f1ece2; --g-muted: #aca5b2; --g-line: #3a3841;
  --g-hl: #ffe14d; --g-hl-soft: #3a2c10; --g-good: #3ccb7f; --g-bad: #ff6b78;
  --g-on-ink: #141317; --g-white: #f1ece2; --g-edge: #8e1a5a; --g-dim: rgb(0 0 0 / 0.66); --g-on-signal: #141317;
  --g-halftone: radial-gradient(circle, rgb(255 92 184 / 0.28) 0.9px, transparent 1.3px);
  --bg: var(--g-bg); --bg2: var(--g-bg); --card: var(--g-card); --text: var(--g-ink); --muted: var(--g-muted); --line: var(--g-line);
  --accent: var(--p-b); --accent2: var(--p-b); --accent-soft: var(--p-b-soft); --ok: var(--g-good); --no: var(--g-bad);
  --rule: rgb(255 92 184 / 0.3);
  --shadow: 3px 3px 0 var(--g-edge);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-synthesis: none; }
html, body { margin: 0; }
body {
  font-family: var(--g-font-body); font-size: 16px; line-height: 1.4;
  background: var(--bg); color: var(--text); min-height: 100dvh;
  -webkit-font-smoothing: antialiased; transition: background-color 0.3s;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
h1, h2, h3 { margin: 0; line-height: 1.15; }
:where(#app, .sheet) :where(h1, h2, h3) { font-family: var(--g-font-display); font-weight: 900; }
p { margin: 0; }
.muted { color: var(--muted); }
.tiny { font-size: 0.86rem; }
.center-text { text-align: center; }

/* printed icons: 2px key-plate stroke, `.f` takes a flat ink */
.ico { width: 22px; height: 22px; flex: none; display: block; overflow: visible; }
.ico * { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico .f { fill: var(--ico-fill, transparent); }
.ico .d { fill: currentColor; stroke: none; }

#app { max-width: 560px; margin: 0 auto; padding-bottom: calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom)); }

/* ── top bar ── */
.topbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; min-height: 66px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--bg); border-bottom: 2px solid var(--text);
}
.topbar h1 { flex: 1; min-width: 0; font-size: 1.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.icon-btn { flex: none; width: 44px; height: 44px; display: grid; place-items: center; color: var(--text); background: var(--card); border: 2px solid var(--text); border-radius: 10px; box-shadow: 2px 2px 0 var(--g-edge); transition: transform 0.08s, box-shadow 0.08s; }
.icon-btn .ico { width: 22px; height: 22px; }
.icon-btn .ico * { stroke-width: 2.6; }
.icon-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--g-edge); }
.icon-btn.ghost { display: none; }
.topbar.is-play h1 { font-size: 1.12rem; }
.count { font-weight: 900; font-size: 0.95rem; font-variant-numeric: tabular-nums; padding: 7px 11px; border: 2px solid var(--text); border-radius: 999px; background: var(--card); }
.pill { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 4px 11px; color: var(--text); background: var(--card); border: 2px solid var(--text); border-radius: 999px; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.02em; white-space: nowrap; }
.pill::after { content: ''; position: absolute; inset: -5px -2px; } /* 44 px to the thumb */
.pill .ico { width: 15px; height: 15px; }
.pill .ico * { stroke-width: 2.4; }
.pill-dot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--muted); vertical-align: middle; }
.pill.ok .pill-dot, .pill-dot.ok { background: var(--g-good); border-color: var(--text); }
.pill-dot.warn { background: var(--g-bad); border-color: var(--text); }
.pill.warn { background: var(--g-hl); color: var(--g-on-ink); border-color: var(--text); }
.pill.warn .pill-dot { background: var(--g-bad); border-color: var(--g-on-ink); }

.screen { padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 16px; }
.screen.center { align-items: center; text-align: center; padding-top: 26px; }
.screen.center > .btn, .screen.center .stack { width: 100%; }
.big { font-size: clamp(1.9rem, 9vw, 2.4rem); line-height: 1.02; letter-spacing: -0.005em; }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* ── cards ── */
.card { background: var(--card); color: var(--text); border: 2px solid var(--text); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; width: 100%; text-align: left; }
.card h2 { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; }
.card h2 .ico { width: 34px; height: 34px; padding: 5px; color: var(--text); background: var(--g-hl-soft); border: 2px solid var(--text); border-radius: 8px; --ico-fill: var(--g-hl); }
.card h2 .pill-dot { width: 14px; height: 14px; }
.card > .btn.small { align-self: flex-start; }
.card.notice { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; background: var(--g-hl); color: var(--g-on-ink); }
.card.notice .btn { flex: none; }
.eyebrow { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.q { font-size: 1.35rem; line-height: 1.2; }

/* ── buttons: an ink block on a yellow plate ── */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 12px 18px;
  font-family: var(--g-font-body); font-weight: 800; font-size: 1rem; line-height: 1.15; text-align: center;
  color: var(--bg); background: var(--text); border: 2px solid var(--text); border-radius: 10px;
  box-shadow: 4px 4px 0 0 var(--plate, var(--g-hl)), 4px 4px 0 2px var(--text);
  transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
}
.btn .ico { width: 20px; height: 20px; }
.btn .ico * { stroke-width: 2.5; }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 0 var(--plate, var(--g-hl)), 1px 1px 0 2px var(--text); }
.btn.alt { color: var(--text); background: var(--card); box-shadow: var(--shadow); }
.btn.alt:active { box-shadow: 0 0 0 var(--g-edge); }
.btn.ghost { color: var(--text); background: transparent; box-shadow: none; }
.btn.ghost:active { transform: translate(1px, 1px); box-shadow: none; }
.btn.small { width: auto; min-height: 44px; padding: 9px 15px; font-size: 0.92rem; align-self: center; }
.btn.big-btn { min-height: 58px; font-size: 1.08rem; }
.btn.hot { color: var(--g-on-ink); background: var(--p-b); }
/* after dark the pink leads: primary buttons print pink on a cream underprint */
.spicy-mode .btn:not(.alt):not(.ghost) { color: var(--g-on-ink); background: var(--p-b); --plate: var(--g-white); }
.spicy-mode .chip-btn.on { box-shadow: 3px 3px 0 var(--p-b); }
.btn[disabled] { opacity: 0.5; box-shadow: none; transform: none; cursor: default; }
/* every control shows where the keyboard is: a blue ink ring, off-register */
:where(#app, .sheet, .toast) button:focus-visible, .tick.link:focus-visible { outline: 3px solid var(--p-a); outline-offset: 3px; }
.spicy-mode :where(#app, .sheet) button:focus-visible { outline-color: var(--p-b); }

.input {
  width: 100%; padding: 13px 14px; color: var(--text); background: var(--bg); border: 2px solid var(--text); border-radius: 10px;
  font: 500 16px/1.4 var(--g-font-body); resize: vertical;
}
.input::placeholder { color: var(--muted); opacity: 1; }
.input:focus { outline: none; background: var(--card); box-shadow: 0 0 0 4px var(--g-hl); }

/* ── the front page ── */
.front { display: flex; flex-direction: column; gap: 22px; padding: 0 16px 28px; }
.masthead { padding-top: calc(8px + env(safe-area-inset-top)); text-align: center; }
.mast-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 42px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
.mast-line:first-child { padding-bottom: 6px; border-bottom: 2px solid var(--text); }
.mast-line .pill { letter-spacing: 0.04em; }
.mast-title { margin: 14px 0 12px; font-size: clamp(3rem, 18vw, 4.6rem); line-height: 0.88; letter-spacing: -0.01em; text-shadow: -2px -2px 0 var(--p-a), 3px 3px 0 var(--p-b); }
.mast-names { min-height: 36px; padding-top: 6px; border-top: 5px double var(--text); }
.mast-names b { font-weight: 900; }
.ink-a { color: var(--p-a-text); }
.ink-b { color: var(--p-b-text); }
.ticker { display: grid; grid-template-columns: 1fr 1fr; margin-top: -14px; border-bottom: 2px solid var(--text); }
.tick { display: flex; flex-direction: column; gap: 6px; padding: 12px 0 14px; text-align: left; color: var(--text); }
.tick + .tick { padding-left: 16px; border-left: 2px solid var(--text); }
.tick b { display: flex; align-items: center; gap: 6px; font-family: var(--g-font-display); font-weight: 900; font-size: 2.5rem; line-height: 0.95; font-variant-numeric: tabular-nums; }
.tick span { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.tick.hot b .ico { width: 30px; height: 30px; --ico-fill: var(--p-b); }
.tick.link b .ico { width: 38px; height: 38px; --ico-fill: var(--g-hl); }
.tick.link span { color: var(--text); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.front-sec { display: flex; flex-direction: column; gap: 12px; }

/* today's question is the lead story */
.daily:not(.compact) { padding: 0; gap: 14px; background: transparent; border: 0; box-shadow: none; border-radius: 0; }
.daily:not(.compact) .eyebrow { align-self: flex-start; padding: 5px 9px 4px; color: var(--g-on-ink); background: var(--g-hl); border: 2px solid var(--text); transform: rotate(-1.5deg); }
.daily:not(.compact) .q { font-size: clamp(1.5rem, 7vw, 1.85rem); line-height: 1.12; }
.daily.compact .q { font-size: 1.12rem; }
.daily-act { display: flex; align-items: center; gap: 14px; }
.daily-act .btn { width: auto; flex: none; }
.daily-act p { margin: 0; line-height: 1.35; }
.daily .btn.small { align-self: flex-start; }
.locked { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--muted); }
.locked .ico { --ico-fill: var(--g-hl-soft); }
.bubble { position: relative; padding: 11px 14px 12px; color: var(--text); background: var(--card); border: 2px solid var(--text); border-radius: 10px; }
.bubble.mine { margin-right: 22px; }
.bubble.theirs { margin-left: 22px; }
.bubble.p-a { background: var(--p-a-soft); }
.bubble.p-b { background: var(--p-b-soft); }
.bubble .who { display: inline-block; margin-bottom: 6px; padding: 3px 7px 2px; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--g-on-ink); background: var(--g-hl); border-radius: 4px; }
.bubble.p-a .who { background: var(--p-a); }
.bubble.p-b .who { background: var(--p-b); }
.bubble .txt { white-space: pre-wrap; word-break: break-word; font-size: 1rem; line-height: 1.4; }

/* section labels with a printed rule */
.section { display: flex; align-items: center; gap: 8px; margin: 4px 0 0; font-family: var(--g-font-body); font-weight: 800; font-size: 0.74rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text); }
.section::after { content: ''; flex: 1; height: 2px; background: var(--text); }
.section .ico { width: 20px; height: 20px; --ico-fill: var(--g-hl); }
.sub { margin: -4px 0 2px; }

/* ── lists ── */
.list { background: var(--card); border: 2px solid var(--text); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; text-align: left; color: var(--text); }
.row + .row { border-top: 1.5px solid var(--rule); }
.row:active { background: var(--g-hl-soft); }
.row-ico { flex: none; width: 38px; height: 38px; display: grid; place-items: center; background: var(--cs, var(--g-hl-soft)); border: 2px solid var(--text); border-radius: 8px; --ico-fill: var(--ci, var(--g-hl)); }
.row-ico .ico { width: 24px; height: 24px; }
.row-title { flex: 1; min-width: 0; font-weight: 800; font-size: 1rem; line-height: 1.25; }
.row-note { font-size: 0.82rem; font-weight: 700; color: var(--muted); }
.chev { display: grid; place-items: center; color: var(--muted); }
.chev .ico { width: 18px; height: 18px; }
.chev .ico * { stroke-width: 2.6; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 8px 4px; font-size: 0.72rem; font-weight: 800; line-height: 1; white-space: nowrap; color: var(--text); background: var(--card); border: 1.5px solid var(--text); border-radius: 999px; }
.chip .ico { width: 12px; height: 12px; }
.chip .ico * { stroke-width: 3.2; }
.chip.hot { color: var(--g-on-ink); background: var(--p-b); }
.chip.ok { color: var(--bg); background: var(--text); }
.chip.dim { color: var(--muted); background: transparent; border-style: dashed; }

/* category inks (a pack is an issue of its category) */
.c-quiz, .c-who, .c-spicytalk { --ci: var(--p-a); --cs: var(--p-a-soft); }
.c-wyr, .c-talk, .c-desire, .c-spicyquiz { --ci: var(--p-b); --cs: var(--p-b-soft); }
.c-thisorthat, .c-nhie, .c-about, .c-spicyplay { --ci: var(--g-hl); --cs: var(--g-hl-soft); }
/* people's inks */
.p-a { --pi: var(--p-a); --ps: var(--p-a-soft); --pt: var(--p-a-text); }
.p-b { --pi: var(--p-b); --ps: var(--p-b-soft); --pt: var(--p-b-text); }
.who-dot { display: inline-block; flex: none; width: 13px; height: 13px; border-radius: 50%; background: var(--pi, var(--g-hl)); border: 2px solid var(--text); }

/* ── tiles ── */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 16px;
  min-height: 112px; padding: 12px; text-align: left; color: var(--text); background: var(--card);
  border: 2px solid var(--text); border-radius: var(--radius); box-shadow: var(--shadow);
  font-family: var(--g-font-display); font-weight: 900; font-size: 1rem; line-height: 1.1;
  transition: transform 0.08s, box-shadow 0.08s;
}
.tile .ico { width: 42px; height: 42px; padding: 6px; color: var(--text); background: var(--ts, var(--g-hl-soft)); border: 2px solid var(--text); border-radius: 9px; --ico-fill: var(--ti, var(--g-hl)); }
.tile:active, .ptile:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--g-edge); }
.tone-a { --ti: var(--p-a); --ts: var(--p-a-soft); }
.tone-b { --ti: var(--p-b); --ts: var(--p-b-soft); }
.tone-y { --ti: var(--g-hl); --ts: var(--g-hl-soft); }
.tone-w { --ti: var(--g-card); --ts: var(--g-bg); }
.grid2.feature .tile { flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; min-height: 76px; }
.tile.hot { color: var(--g-on-ink); background: var(--p-b); }
.tile.hot .ico { background: var(--g-bg); --ico-fill: var(--p-b); color: var(--text); }

/* ── question shelves ── */
.shelf { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
.shelf-head { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; border-top: 2px solid var(--text); }
.shelf-title { font-size: 1.28rem; line-height: 1.1; }
.shelf-title i { margin-right: 8px; vertical-align: 0.3em; font-family: var(--g-font-body); font-style: normal; font-weight: 800; font-size: 0.66rem; letter-spacing: 0.1em; color: var(--muted); }
.shelf-note { color: var(--muted); font-size: 0.88rem; font-weight: 600; }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
.ptile {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 146px; padding: 12px;
  text-align: left; color: var(--text); background: var(--card); border: 2px solid var(--text); border-radius: var(--radius); box-shadow: var(--shadow);
  transition: transform 0.08s, box-shadow 0.08s;
}
.ptile .pe { width: 44px; height: 44px; display: grid; place-items: center; background: var(--cs); border: 2px solid var(--text); border-radius: 9px; --ico-fill: var(--ci); }
.ptile .pe .ico { width: 28px; height: 28px; }
.ptile.both .pno { visibility: hidden; }
.pno { position: absolute; top: 12px; right: 12px; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.pt { font-family: var(--g-font-display); font-weight: 900; font-size: 1rem; line-height: 1.15; }
.ps { display: flex; align-items: center; gap: 4px; width: 100%; margin-top: auto; }
.pc { margin-left: auto; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.dot { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; font-size: 0.68rem; font-weight: 900; color: var(--muted); background: transparent; border: 2px dashed var(--muted); }
.dot.half { color: var(--text); border: 2px solid var(--text); background: linear-gradient(90deg, var(--pi) 50%, var(--card) 50%); }
.dot.on { color: var(--g-on-ink); border: 2px solid var(--text); background: var(--pi); }
.pstamp { position: absolute; top: -10px; right: 10px; padding: 5px 7px 4px; font-family: var(--g-font-display); font-weight: 900; font-size: 0.62rem; line-height: 1; text-transform: uppercase; color: var(--g-on-ink); background: var(--g-hl); border: 2px solid var(--text); border-radius: 5px; transform: rotate(4deg); box-shadow: 2px 2px 0 var(--g-edge); }

/* ── pack intro: the issue's cover ── */
.pack-intro { gap: 14px; }
.pack-cover {
  position: relative; width: 100%; aspect-ratio: 16 / 9; display: grid; place-items: center; overflow: hidden;
  background: var(--g-halftone) 0 0 / 6px 6px, var(--cs, var(--g-hl-soft)); border: 2.5px solid var(--text); border-radius: 14px;
  box-shadow: var(--g-shadow-lg); color: var(--text); --ico-fill: var(--ci, var(--g-hl)); margin-bottom: 6px;
}
.pack-cover .ico { width: 104px; height: 104px; margin-top: -18px; }
.pack-cover .ico * { stroke-width: 1.3; }
.pack-no { position: absolute; left: 12px; top: 10px; font-family: var(--g-font-display); font-weight: 900; font-size: 1.05rem; }
.pack-cat { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px 7px; text-align: left; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bg); background: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pack-cover.is-wait .ico { animation: tip 2.4s ease-in-out infinite; }
.status-row { display: flex; gap: 10px 18px; justify-content: center; flex-wrap: wrap; margin: 4px 0 10px; font-weight: 800; }
.status-row > div { display: flex; align-items: center; gap: 7px; }

/* ── playing a pack ── */
.progress { height: 12px; margin: 14px 16px 0; overflow: hidden; background: var(--card); border: 2px solid var(--text); border-radius: 99px; }
.progress i { display: block; height: 100%; background: var(--g-hl); box-shadow: 2px 0 0 var(--text); transition: width 0.3s; }
.qcard { padding: 20px 16px; animation: pop 0.28s ease; }
.label { margin-top: 6px; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { min-height: 50px; padding: 10px 10px; font-weight: 700; font-size: 0.93rem; line-height: 1.25; color: var(--text); background: var(--bg); border: 2px solid var(--text); border-radius: 9px; transition: background-color 0.12s, transform 0.12s, box-shadow 0.12s; }
.opt.sel { color: var(--g-on-ink); background: var(--pi, var(--g-hl)); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--g-edge); }
.vs { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.vs.two { flex-direction: row; }
.vs.two .choice { flex: 1; }
.or { position: relative; z-index: 1; align-self: center; width: 42px; height: 42px; margin: -22px 0; display: grid; place-items: center; font-family: var(--g-font-display); font-weight: 900; font-size: 0.8rem; color: var(--g-on-ink); background: var(--g-hl); border: 2px solid var(--text); border-radius: 50%; transform: rotate(-8deg); }
.choice {
  position: relative; min-height: 78px; padding: 18px 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  font-weight: 800; font-size: 1.08rem; line-height: 1.3; color: var(--text); background: var(--bg); border: 2px solid var(--text); border-radius: 12px;
  box-shadow: var(--shadow); transition: transform 0.12s, box-shadow 0.12s, background-color 0.12s;
}
.choice .ico { width: 28px; height: 28px; }
.choice small { font-size: 0.75rem; color: var(--muted); font-weight: 700; }
.choice.sel { color: var(--g-on-ink); background: var(--pi, var(--g-hl)); transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--g-edge); }
.choice.sel small { color: inherit; opacity: 0.75; }
.choice.big { min-height: 160px; font-family: var(--g-font-display); font-weight: 900; font-size: 1.6rem; }
.ynm { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.ynm .choice { min-height: 64px; padding: 12px 6px; font-size: 1rem; }
.ynm .choice.y.sel { background: var(--p-b); }
.ynm .choice.m.sel { background: var(--g-hl); }
.ynm .choice.n.sel { color: var(--bg); background: var(--text); }
.nav-row { display: flex; justify-content: space-between; }
.play .nav-row .btn { min-height: 44px; }

/* ── results ── */
.results .rcard { display: flex; flex-direction: column; gap: 8px; padding: 14px; background: var(--card); border: 2px solid var(--text); border-radius: 12px; }
.rcard.match { box-shadow: inset 7px 0 0 var(--g-hl); padding-left: 18px; }
.rq { font-weight: 800; line-height: 1.3; }
.rline { font-size: 0.95rem; line-height: 1.45; }
.rline b[class^="ink-"] { padding: 0 2px; }
.mark { display: inline-block; margin-left: 4px; padding: 2px 7px; font-size: 0.76rem; font-weight: 800; border-radius: 4px; border: 1.5px solid var(--text); }
.mark.ok { color: var(--g-on-ink); background: var(--g-hl); }
.mark.no { color: var(--g-bad); border-color: currentColor; border-style: dashed; }
.nh-have { color: var(--text); background: var(--g-hl-soft); padding: 0 4px; border-radius: 3px; }
.nh-never { color: var(--muted); font-weight: 700; }
.pickrow { flex-direction: row !important; gap: 8px !important; }
.side { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 10px; font-size: 0.92rem; font-weight: 700; color: var(--muted); border: 2px dashed var(--rule); border-radius: 9px; }
.side.picked { color: var(--text); background: var(--bg); border: 2px solid var(--text); }
.avs { display: flex; gap: 4px; min-height: 25px; }
.av { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 0.7rem; font-weight: 900; color: var(--g-on-ink); background: var(--pi, var(--g-hl)); border: 2px solid var(--text); }
.score-big { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; text-align: center; }
.score-big b { font-family: var(--g-font-display); font-weight: 900; font-size: 3.8rem; line-height: 1; text-shadow: 3px 3px 0 var(--g-hl); }
.score-big span { font-weight: 800; }
.score-big small, .score-duo small { color: var(--muted); }
.score-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
.score-duo > div { display: flex; flex-direction: column; gap: 4px; padding: 12px; background: var(--ps, var(--card)); border: 2px solid var(--text); border-radius: 12px; }
.results .score-duo > div, .score-duo.large > div { box-shadow: var(--shadow); }
.score-duo b { font-family: var(--g-font-display); font-weight: 900; font-size: 2rem; line-height: 1; color: var(--text); text-shadow: 2px 2px 0 var(--pi, var(--g-hl)); }
.score-duo span { font-size: 0.82rem; font-weight: 800; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { padding: 7px 12px; font-weight: 700; font-size: 0.92rem; background: var(--card); border: 2px solid var(--text); border-radius: 999px; }
.tag.hot { color: var(--g-on-ink); background: var(--p-b); }
.card.ll .ll-who { align-self: flex-start; padding: 3px 8px 2px; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--g-on-ink); background: var(--pi); border: 2px solid var(--text); border-radius: 5px; }
.bar { display: grid; grid-template-columns: 1fr 90px 18px; align-items: center; gap: 8px; font-size: 0.88rem; font-weight: 600; }
.bar i { min-width: 6px; height: 12px; background: var(--pi, var(--g-hl)); border: 2px solid var(--text); border-radius: 3px; }
.bar b { text-align: right; font-variant-numeric: tabular-nums; }
.tip { margin: 4px 0 0; padding: 10px 12px; font-size: 0.92rem; line-height: 1.4; background: var(--g-hl-soft); border: 2px solid var(--text); border-radius: 9px; }
.tip b { display: block; margin-bottom: 4px; font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; }
.footer-actions { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 10px; }

/* ── truth or dare + date spinner ── */
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 15px; font-size: 0.9rem; font-weight: 800; color: var(--text); background: var(--card); border: 2px solid var(--text); border-radius: 999px; transition: transform 0.1s, box-shadow 0.1s; }
.chip-btn .ico { width: 16px; height: 16px; --ico-fill: var(--p-b); }
.chip-btn.on { color: var(--bg); background: var(--text); box-shadow: 3px 3px 0 var(--g-hl); transform: translate(-1px, -1px); }
.turn { display: inline-flex; align-items: center; gap: 9px; margin: 8px 0 0; font-family: var(--g-font-display); font-weight: 900; font-size: 1.4rem; }
.turn .who-dot { width: 20px; height: 20px; }
.todcard { min-height: 220px; justify-content: center; align-items: center; text-align: center; padding: 26px 20px; border-width: 2.5px; box-shadow: var(--g-shadow-lg); animation: deal 0.35s cubic-bezier(0.2, 1.3, 0.4, 1); }
.todcard .eyebrow { padding: 5px 10px 4px; color: var(--g-on-ink); background: var(--g-hl); border: 2px solid var(--text); border-radius: 6px; }
.todcard.dare .eyebrow { background: var(--p-b); }
.todcard h2 { font-size: 1.45rem; line-height: 1.22; }
.tcard {
  background-color: var(--g-hl);
  background-image: repeating-linear-gradient(45deg, transparent 0 10px, color-mix(in srgb, #18171d 14%, transparent) 10px 12px), repeating-linear-gradient(-45deg, transparent 0 10px, color-mix(in srgb, #18171d 14%, transparent) 10px 12px);
}
.tcard.dare { background-color: var(--p-b); }
.tcard span { padding: 9px 16px 8px; color: var(--text); background: var(--card); border: 2px solid var(--text); border-radius: 9px; }
.spin { min-height: 176px; justify-content: center; }
.spin-label { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.spin-label .ico { width: 18px; height: 18px; --ico-fill: var(--g-hl); }
.spin h2 { font-size: 1.45rem; line-height: 1.2; }
.spin:not(.has-pick) h2 { color: var(--muted); }
.spin.spinning h2 { opacity: 0.5; }
.spin.spinning .spin-label .ico { animation: turn 0.5s linear infinite; }
.gate { gap: 14px; padding-top: 44px; }
.gate-mark { width: 136px; height: 136px; display: grid; place-items: center; margin-bottom: 8px; color: var(--text); background: var(--g-halftone) 0 0 / 6px 6px, var(--p-b-soft); border: 2.5px solid var(--text); border-radius: 50%; box-shadow: 6px 6px 0 var(--p-b); --ico-fill: var(--p-b); }
.gate-mark .ico { width: 74px; height: 74px; }
.gate-mark .ico * { stroke-width: 1.4; }
.gate h2 { font-size: 1.85rem; }
.gate .btn { max-width: 320px; }

/* ── us ── */
.add-row { display: flex; gap: 8px; }
.add-row .btn { flex-shrink: 0; width: auto; }
.bucket { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.bucket li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1.5px dashed var(--rule); }
.bucket li:last-child { border-bottom: 0; }
.bucket .check, .bucket .x { position: relative; }
.bucket .check::after, .bucket .x::after { content: ''; position: absolute; inset: -7px; } /* 44 px to the thumb */
.bucket .check { flex: none; width: 30px; height: 30px; display: grid; place-items: center; color: var(--g-on-ink); background: var(--card); border: 2px solid var(--text); border-radius: 7px; }
.bucket .check .ico { width: 20px; height: 20px; }
.bucket .check .ico * { stroke-width: 3; }
.bucket li.done .check { background: var(--g-hl); }
.bucket li.done .bt { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.bt { flex: 1; display: flex; flex-direction: column; gap: 2px; font-weight: 600; }
.bt small { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--pt, var(--muted)); text-decoration: none; }
.bucket .x { flex: none; width: 32px; height: 32px; margin-right: 2px; display: grid; place-items: center; color: var(--muted); }
.bucket .x .ico { width: 18px; height: 18px; }
.ll-line { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.ll-line b { padding: 3px 8px 2px; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--g-on-ink); background: var(--pi); border: 2px solid var(--text); border-radius: 5px; }
.colophon { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

/* their mark: two rings, overprinting where they meet */
.logo-mark { width: 152px; height: auto; overflow: visible; isolation: isolate; }
.logo-mark .lw { fill: #fff; }
.logo-mark .la { fill: var(--p-a); }
.logo-mark .lb { fill: var(--p-b); mix-blend-mode: multiply; }
.logo-mark .lk { fill: none; stroke: var(--text); stroke-width: 3; }
.logo-mark.small { width: 40px; }
.logo-mark.small .lk { stroke-width: 6; }
.logo-mark.is-loading .la { animation: ring-a 1.6s ease-in-out infinite; }
.logo-mark.is-loading .lb, .logo-mark.is-loading .lw { animation: ring-b 1.6s ease-in-out infinite; }
.onboard { min-height: calc(100dvh - 40px); justify-content: center; gap: 16px; }
.onboard .mast-title { margin: 0; font-size: clamp(3rem, 17vw, 4.2rem); }
.onboard-lede { max-width: 300px; font-size: 1.05rem; font-weight: 600; line-height: 1.4; }
.onboard .stack { margin-top: 12px; }
.who-btn { min-height: 62px; flex-direction: column; gap: 2px; font-family: var(--g-font-display); font-weight: 900; font-size: 1.15rem; }
.who-btn small { font-family: var(--g-font-body); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.04em; opacity: 0.8; }
.onboard-note { max-width: 300px; margin-top: 6px; line-height: 1.4; }
.who-btn.p-a { color: var(--g-on-ink); background: var(--p-a); }
.who-btn.p-b { color: var(--g-on-ink); background: var(--p-b); }

/* ── tab bar ── */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 2px;
  padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 2px solid var(--text);
}
.tab { position: relative; flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.02em; color: var(--muted); border-radius: 10px; }
.tab-ico { width: 26px; height: 26px; display: block; overflow: visible; transition: transform 0.2s cubic-bezier(0.3, 1.6, 0.5, 1); }
.tab-ico * { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: fill 0.15s; }
.tab-ico .d { fill: currentColor; stroke: none; }
.tab.on { color: var(--text); }
.tab.on::before { content: ''; position: absolute; top: -8px; left: 24%; right: 24%; height: 4px; background: var(--text); border-radius: 0 0 3px 3px; }
.tab.on .tab-ico { transform: translateY(-1px) scale(1.06); }
.tab.on .tab-ico .f { fill: var(--g-hl); }
.spicy-mode .tab.on .tab-ico .f { fill: var(--p-b); }
.tab:active .tab-ico { transform: scale(0.9); }

/* ── toast + confirm sheet ── */
/* a toast is a printed slip: it never takes a tap (pointer-events: none), and sizes to its words */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom)); z-index: 70;
  width: max-content; max-width: calc(100% - 32px); padding: 12px 16px; text-align: center; font-family: var(--g-font-body); font-weight: 800; line-height: 1.3;
  color: var(--bg); background: var(--text); border: 2px solid var(--text); border-radius: 10px; box-shadow: 3px 3px 0 var(--g-hl);
  transform: translate(-50%, 20px); opacity: 0; transition: transform 0.25s, opacity 0.25s; pointer-events: none;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }
/* in a game it drops onto the status line under the player chips, clear of the board */
.toast.in-game { top: calc(64px + env(safe-area-inset-top, 0px)); bottom: auto; padding: 9px 14px; font-size: 0.92rem; color: var(--g-on-ink); background: var(--g-hl); border-color: var(--g-ink); box-shadow: var(--g-shadow); transform: translate(-50%, -14px); }
.toast.in-game.show { transform: translate(-50%, 0); }
.sheet-wrap { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); background: var(--g-dim); }
.sheet { width: 100%; max-width: 420px; padding: 18px; color: var(--text); background: var(--card); border: 2.5px solid var(--text); border-radius: 16px; box-shadow: var(--g-shadow-lg); font-family: var(--g-font-body); animation: rise 0.28s cubic-bezier(0.2, 1.2, 0.4, 1); }
.sheet-kicker { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.sheet p:not(.sheet-kicker) { margin: 6px 0 20px; font-family: var(--g-font-display); font-weight: 900; font-size: 1.2rem; line-height: 1.25; }
.sheet-btns { display: flex; justify-content: flex-end; gap: 12px; }

@media (min-width: 520px) {
  .pgrid { grid-template-columns: 1fr 1fr 1fr; }
}
@media (max-width: 374px) {
  .tick b { font-size: 2.1rem; }
  .daily-act { flex-direction: column; align-items: stretch; }
  .daily-act .btn { width: 100%; }
}

@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes deal { from { opacity: 0; transform: translateY(24px) rotate(3deg); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(30px); } }
@keyframes tip { 0%, 40% { transform: rotate(0); } 50%, 90% { transform: rotate(180deg); } 100% { transform: rotate(180deg); } }
@keyframes turn { to { transform: rotate(360deg); } }
@keyframes ring-a { 50% { transform: translateX(10px); } }
@keyframes ring-b { 50% { transform: translateX(-10px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ════════════════════════════════════════════════════════════════════════
   Game room. Printed in four Riso inks: Blue (Emerson), Fluorescent Pink (Sydney),
   Yellow (highlight) and a Black key plate, on paper. Dark mode is the same job
   screen-printed on black card stock. Flat ink, crisp outlines, hard offset shadows.
   ════════════════════════════════════════════════════════════════════════ */
:root {
  --p-a: #0a8ad6;            /* Emerson: Riso Blue */
  --p-b: #ff4aaa;            /* Sydney: Riso Fluorescent Pink */
  --p-a-soft: #d3e8f6;       /* 20% tints of each ink */
  --p-b-soft: #ffdcec;
  --p-a-text: #0b62a6;       /* the inks, deep enough for small text on paper (≥ 5:1) */
  --p-b-text: #c3176f;
  --g-bg: #f3f1eb;           /* paper */
  --g-card: #fffdf8;         /* brighter stock for raised pieces */
  --g-ink: #18171d;          /* key plate: text, outlines */
  --g-muted: #5e5a66;
  --g-line: #d6d1c6;
  --g-hl: #ffdd1f;           /* Riso Yellow */
  --g-hl-soft: #fff1a6;
  --g-good: #11794a;
  --g-bad: #cc2e44;
  --g-on-ink: #18171d;       /* text on --p-a, --p-b, --g-hl (black overprint, ≥ 4.7:1 on all three) */
  --g-on-signal: #ffffff;    /* text on --g-good / --g-bad (white on paper, black on black stock) */
  --g-white: #fffdf8;        /* paper white in both themes (knockouts, stickers) */
  --g-edge: #18171d;         /* colour of hard shadows */
  --g-dim: rgb(24 23 29 / 0.46);
  --g-radius: 10px;
  --g-radius-sm: 6px;
  --g-stroke: 2px;
  --g-shadow-sm: 2px 2px 0 var(--g-edge);
  --g-shadow: 3px 3px 0 var(--g-edge);
  --g-shadow-lg: 6px 6px 0 var(--g-edge);
  --g-font-display: 'Rammetto One', 'Arial Black', 'Helvetica Neue', Impact, system-ui, sans-serif;
  --g-font-body: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif;
  --g-halftone: radial-gradient(circle, rgb(24 23 29 / 0.2) 0.9px, transparent 1.3px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --p-a: #3fa7f5; --p-b: #ff5cb8; --p-a-soft: #11304a; --p-b-soft: #431a33;
    --p-a-text: #6dbbf7; --p-b-text: #ff7cc6;
    --g-bg: #141317; --g-card: #1f1e24; --g-ink: #f1ece2; --g-muted: #a39eaa; --g-line: #3a3841;
    --g-hl: #ffe14d; --g-hl-soft: #3a2c10; --g-good: #3ccb7f; --g-bad: #ff6b78;
    --g-on-ink: #141317; --g-white: #f1ece2; --g-edge: #000000; --g-dim: rgb(0 0 0 / 0.62);
    --g-halftone: radial-gradient(circle, rgb(241 236 226 / 0.12) 0.9px, transparent 1.3px);
    --g-on-signal: #141317;
  }
}
:root[data-theme="dark"] {
  --p-a: #3fa7f5; --p-b: #ff5cb8; --p-a-soft: #11304a; --p-b-soft: #431a33;
  --p-a-text: #6dbbf7; --p-b-text: #ff7cc6;
  --g-bg: #141317; --g-card: #1f1e24; --g-ink: #f1ece2; --g-muted: #a39eaa; --g-line: #3a3841;
  --g-hl: #ffe14d; --g-hl-soft: #3a2c10; --g-good: #3ccb7f; --g-bad: #ff6b78;
  --g-on-ink: #141317; --g-white: #f1ece2; --g-edge: #000000; --g-dim: rgb(0 0 0 / 0.62);
  --g-halftone: radial-gradient(circle, rgb(241 236 226 / 0.12) 0.9px, transparent 1.3px);
  --g-on-signal: #141317;
}

[hidden] { display: none !important; }

/* ════════ KIT: shared pieces for game authors (see docs/GAMES.md) ════════ */
.gm-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 18px;
  font-family: var(--g-font-body); font-weight: 800; font-size: 1rem; line-height: 1.1;
  color: var(--g-bg); background: var(--g-ink);
  border: var(--g-stroke) solid var(--g-ink); border-radius: var(--g-radius);
  /* a yellow plate printed slightly off-register under every primary button */
  box-shadow: 4px 4px 0 0 var(--g-hl), 4px 4px 0 var(--g-stroke) var(--g-ink);
  touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: pointer;
  transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
}
.gm-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 0 var(--g-hl), 1px 1px 0 var(--g-stroke) var(--g-ink); }
.gm-btn:focus-visible, .gh-card:focus-visible, .gh-row:focus-visible, .gh-filter:focus-visible, .gm-icon:focus-visible, .g-key:focus-visible { outline: 3px solid var(--p-a); outline-offset: 3px; }

.g-panel { background: var(--g-card); color: var(--g-ink); border: var(--g-stroke) solid var(--g-ink); border-radius: var(--g-radius); box-shadow: var(--g-shadow); }

.g-key {
  flex: 1 1 0; min-width: 0; height: 52px; display: grid; place-items: center; padding: 0 2px;
  background: var(--g-card); color: var(--g-ink); border: 1.5px solid var(--g-ink); border-radius: 7px;
  box-shadow: 0 3px 0 var(--g-edge); font: 800 1.08rem/1 var(--g-font-body); text-transform: uppercase;

.g-key.is-a { background: var(--p-a); color: var(--g-on-ink); }
.g-key.is-b { background: var(--p-b); color: var(--g-on-ink); }

.g-label { margin: 0; font: 800 0.7rem/1.2 var(--g-font-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--g-muted); }
.g-num { font-family: var(--g-font-display); font-weight: 900; font-size: 2.6rem; line-height: 0.9; font-variant-numeric: tabular-nums; color: var(--g-ink); }

.g-devices { display: inline-flex; gap: 3px; flex: none; }
.g-device { display: inline-flex; align-items: center; gap: 4px; height: 22px; min-width: 22px; padding: 0 3px; justify-content: center; border-radius: 5px; color: var(--g-ink); font: 800 0.72rem/1 var(--g-font-body); }

.g-device.is-best { background: var(--g-hl); color: var(--g-on-ink); box-shadow: inset 0 0 0 1.5px var(--g-ink); }

/* covers: art is 160×100 and crops to whatever box it sits in */
.gh-card-cover svg, .gs-cover svg, .gh-row-cover svg, .gm-invite-cover svg, .gh-invite-cover svg { display: block; width: 100%; height: 100%; }

/* ════════ overlay root ════════ */
#game-root {
  position: fixed; inset: 0; z-index: 40; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: none;
  background: var(--g-bg); color: var(--g-ink); font-family: var(--g-font-body);
}
body.gm-open { overflow: hidden; }
/* the page behind is pinned while the game room is open (core.js sets top to keep its place) */
body.gm-pinned { position: fixed; left: 0; right: 0; width: 100%; }
/* Rammetto One has one weight. Display text asks for 900 so fallbacks come out heavy; this stops a faux-bold Rammetto. */
#game-root, .gh, .gh-home, .gm-invite { font-synthesis: none; }
#game-root h1, #game-root h2, #game-root p { margin: 0; }

/* ════════ game screen ════════ */
.gm { position: relative; min-height: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.gm-top { position: relative; z-index: 10; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 10px; }
.gm-title { font-family: var(--g-font-display); font-weight: 900; font-size: 1.05rem; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gm-icon { width: 44px; height: 44px; display: grid; place-items: center; color: var(--g-ink); background: var(--g-card); border: var(--g-stroke) solid var(--g-ink); border-radius: var(--g-radius); box-shadow: var(--g-shadow-sm); touch-action: manipulation; transition: transform 0.08s, box-shadow 0.08s; }
.gm-icon:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--g-edge); }

/* versus bar: two pieces and a stamp */
.gm-versus { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6px; margin-top: 14px; }
.gm-p {
  position: relative; display: flex; align-items: center; gap: 7px; min-width: 0; height: 48px; padding: 0 12px 0 6px;
  background: var(--g-card); color: var(--g-ink); border: var(--g-stroke) solid var(--g-ink); border-radius: 999px;
  transition: background-color 0.2s, color 0.2s, transform 0.3s cubic-bezier(0.3, 1.6, 0.5, 1), box-shadow 0.3s cubic-bezier(0.3, 1.6, 0.5, 1);
}
.gm-p-b { flex-direction: row-reverse; padding: 0 6px 0 12px; }
.gm-p-dot { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: var(--g-stroke) solid var(--g-ink); font: 900 0.85rem/1 var(--g-font-display); color: var(--g-on-ink); background: var(--p-a); transition: background-color 0.2s; }
.gm-p-b .gm-p-dot { background: var(--p-b); }
.gm-p-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; font-size: 0.95rem; line-height: 1.1; }
.gm-p-b .gm-p-name { text-align: right; }
.gm-p.is-me .gm-p-name::before { content: 'You'; display: block; margin-bottom: 2px; font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.72; }
.gm-p-score { margin-left: auto; font: 900 1.4rem/1 var(--g-font-body); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.gm-p-b .gm-p-score { margin-left: 0; margin-right: auto; }
.gm-p-score:empty { display: none; }
/* whose turn: the piece fills with its ink, lifts, and points at the board */
.gm-p.is-turn { color: var(--g-on-ink); transform: translateY(-3px); box-shadow: 3px 4px 0 var(--g-edge); }
.gm-p-a.is-turn { background: var(--p-a); }
.gm-p-b.is-turn { background: var(--p-b); }
.gm-p.is-turn .gm-p-dot { background: var(--g-hl); }
.gm-p.is-turn::after { content: ''; position: absolute; left: 50%; bottom: -12px; width: 16px; height: 9px; margin-left: -8px; background: var(--g-ink); clip-path: polygon(0 0, 100% 0, 50% 100%); animation: gm-nudge 1.2s ease-in-out infinite; }
.gm-p.is-away { border-style: dashed; color: var(--g-muted); }
.gm-p.is-away .gm-p-dot { opacity: 0.45; }
.gm-vs { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--g-ink); color: var(--g-bg); font: 900 0.68rem/1 var(--g-font-display); transform: rotate(-12deg); }
.gm.is-team .gm-vs { background: var(--g-hl); color: var(--g-on-ink); box-shadow: inset 0 0 0 var(--g-stroke) var(--g-ink); font-size: 0.85rem; }
.gm-status { text-align: center; min-height: 1.35em; margin: 14px 0 6px; font-weight: 800; font-size: 0.95rem; line-height: 1.35; color: var(--g-ink); }
.gm-status-btn { display: inline-flex; align-items: center; min-height: 32px; margin-left: 6px; padding: 2px 11px; vertical-align: middle; font: 800 0.82rem/1 var(--g-font-body); color: var(--g-on-ink); background: var(--g-hl); border: var(--g-stroke) solid var(--g-ink); border-radius: 999px; box-shadow: var(--g-shadow-sm); touch-action: manipulation; }
.gm-status-btn { position: relative; }
.gm-status-btn::after { content: ''; position: absolute; inset: -6px -4px; } /* 44 px to the thumb */
.gm-status-btn:active { transform: translate(2px, 2px); box-shadow: none; }
.gm-status-btn:focus-visible { outline: 3px solid var(--p-a); outline-offset: 3px; }
.gm-stage { flex: 1; position: relative; isolation: isolate; display: flex; flex-direction: column; min-height: 0; }
.gm-stage.is-covered { visibility: hidden; }
.gm-error { margin: 32px auto; padding: 14px 16px; max-width: 320px; text-align: center; font-weight: 700; color: var(--g-bad); border: var(--g-stroke) dashed currentColor; border-radius: var(--g-radius); }

/* immersive (big 3D games): the stage is the whole screen, the chrome turns into two stickers */
/* --gm-corner-safe: how far down a game's HUD must start to clear the back / menu stickers (the
   stickers sit in the top corners, --gm-corner-w wide). */
.gm.is-immersive { --gm-corner-safe: calc(64px + env(safe-area-inset-top, 0px)); --gm-corner-w: calc(64px + env(safe-area-inset-left, 0px)); position: absolute; inset: 0; max-width: none; min-height: 0; margin: 0; padding: 0; }
.gm.is-immersive .gm-versus, .gm.is-immersive .gm-status { display: none; }
.gm.is-immersive .gm-top {
  position: absolute; z-index: 10; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start;
  padding: calc(10px + env(safe-area-inset-top, 0px)) calc(10px + env(safe-area-inset-right, 0px)) 0 calc(10px + env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.gm.is-immersive .gm-top > button { pointer-events: auto; }
.gm.is-immersive .gm-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
/* fixed sticker colours on purpose: they sit on an arbitrary 3D scene in either theme */
.gm.is-immersive .gm-icon { width: 44px; height: 44px; border-radius: 50%; color: #18171d; background: #ffdd1f; border: 2.5px solid #18171d; box-shadow: 0 0 0 3px #fffdf8, 3px 4px 0 3px rgb(0 0 0 / 0.4); }
.gm.is-immersive .gm-icon:active { transform: scale(0.92); }
.gm.is-immersive .gm-stage { position: absolute; inset: 0; touch-action: none; }

/* ════════ overlays inside a game ════════ */
.gm-layer { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: calc(70px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; background: color-mix(in srgb, var(--g-bg) 86%, transparent); }
.gm-layer.gm-end { background: var(--g-halftone) 0 0 / 5px 5px, color-mix(in srgb, var(--g-bg) 84%, transparent); animation: gm-fade 0.25s ease-out both; }
.gm-curtain-card, .gm-wait-card { width: min(100%, 360px); display: flex; flex-direction: column; gap: 12px; padding: 20px; background: var(--g-card); color: var(--g-ink); border: 2.5px solid var(--g-ink); border-radius: 14px; box-shadow: var(--g-shadow-lg); }

/* pass the phone: the screen becomes the back of a playing card in the next player's ink */
.gm-layer.gm-curtain {
  background-color: var(--g-bg);
  background-image: repeating-linear-gradient(45deg, transparent 0 12px, color-mix(in srgb, var(--g-ink) 16%, transparent) 12px 14px), repeating-linear-gradient(-45deg, transparent 0 12px, color-mix(in srgb, var(--g-ink) 16%, transparent) 12px 14px);
}
.gm-layer.gm-curtain:has(.p-a) { background-color: var(--p-a); }
.gm-layer.gm-curtain:has(.p-b) { background-color: var(--p-b); }
.gm-curtain-card { text-align: left; animation: gm-deal 0.42s cubic-bezier(0.2, 1.3, 0.4, 1) both; }
.gm-curtain-kicker { font: 800 0.72rem/1.2 var(--g-font-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--g-muted); }
.gm-curtain-name { font-family: var(--g-font-display); font-weight: 900; font-size: clamp(2.3rem, 12vw, 3.1rem); line-height: 1; overflow-wrap: anywhere; }
.gm-curtain-name.p-a { text-shadow: 3px 3px 0 var(--p-a); }
.gm-curtain-name.p-b { text-shadow: 3px 3px 0 var(--p-b); }
.gm-curtain-card p:not(.gm-curtain-kicker) { font-weight: 600; }
.gm-curtain-card .gm-btn { margin-top: 6px; min-height: 52px; }

/* live: waiting for the other phone */
.gm-wait-card { align-items: center; text-align: center; gap: 8px; animation: gm-deal 0.42s cubic-bezier(0.2, 1.3, 0.4, 1) both; }
.gm-wait-pulse { position: relative; width: 54px; height: 54px; margin: 10px auto 12px; border-radius: 50%; background: var(--p-b); border: 2.5px solid var(--g-ink); animation: gm-bob 1.8s ease-in-out infinite; }
.gm:has(.gm-p-b.is-me) .gm-wait-pulse { background: var(--p-a); }
.gm-wait-pulse::before, .gm-wait-pulse::after { content: ''; position: absolute; inset: -2.5px; border: 2.5px solid var(--g-ink); border-radius: 50%; animation: gm-ring 1.8s cubic-bezier(0.2, 0.6, 0.4, 1) infinite; }
.gm-wait-pulse::after { animation-delay: 0.9s; }
.gm-wait-card b { font-family: var(--g-font-display); font-weight: 900; font-size: 1.25rem; }
.gm-wait-sub { color: var(--g-muted); font-size: 0.92rem; line-height: 1.4; margin-bottom: 8px !important; }
.gm-wait-card .gm-btn { width: 100%; }

/* end card: the result, printed and slapped down */
.gm-end-card { position: relative; width: min(100%, 360px); text-align: left; background: var(--g-card); color: var(--g-ink); border: 2.5px solid var(--g-ink); border-radius: 14px; box-shadow: 7px 7px 0 var(--g-edge); animation: gm-slap 0.6s cubic-bezier(0.2, 1.25, 0.35, 1) both; }
.gm-end-band { position: relative; padding: 18px 18px 18px; border-bottom: 2.5px solid var(--g-ink); border-radius: 11px 11px 0 0; background: var(--g-hl); color: var(--g-on-ink); overflow: hidden; }
.gm-end-card.win-a .gm-end-band { background: var(--p-a); }
.gm-end-card.win-b .gm-end-band { background: var(--p-b); }
.gm-end-card.draw .gm-end-band { background: linear-gradient(115deg, var(--p-a) 0 50%, var(--p-b) 50% 100%); }
.gm-end-card.team .gm-end-band {
  background: radial-gradient(circle at calc(100% - 46px) 54%, var(--p-b) 0 33px, transparent 34px), radial-gradient(circle at calc(100% - 76px) 46%, var(--p-a) 0 33px, transparent 34px), radial-gradient(circle at calc(100% - 46px) 54%, #fff 0 33px, transparent 34px), var(--g-hl);
  background-blend-mode: multiply, normal, normal, normal;
}
.gm-end-kicker { font: 800 0.7rem/1.2 var(--g-font-body); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.78; margin-bottom: 6px !important; }
.gm-end-head { position: relative; font-family: var(--g-font-display); font-weight: 900; font-size: clamp(1.8rem, 8.6vw, 2.4rem); line-height: 1.02; overflow-wrap: anywhere; text-shadow: 3px 3px 0 var(--g-white); animation: gm-register 0.7s 0.12s cubic-bezier(0.3, 1.4, 0.5, 1) both; }
.gm-end-card.team .gm-end-head { max-width: calc(100% - 96px); }
.gm-end-body { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; }
.gm-end-sub { font-weight: 600; font-size: 1rem; line-height: 1.4; }
.gm-end-rec { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 700; font-size: 0.9rem; }
.gm-end-rec-l { width: 100%; font: 800 0.66rem/1 var(--g-font-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--g-muted); }
.gm-end-rec b, .gs-rec b { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; font: 900 1.05rem/1 var(--g-font-body); font-variant-numeric: tabular-nums; color: var(--g-on-ink); background: var(--g-hl); border: var(--g-stroke) solid var(--g-ink); border-radius: var(--g-radius-sm); vertical-align: middle; }
.gm-end-rec .p-a b, .gs-rec .p-a b { background: var(--p-a); }
.gm-end-rec .p-b b, .gs-rec .p-b b { background: var(--p-b); }
.gm-end-rec-sep, .gs-rec-sep { font-family: var(--g-font-display); font-weight: 900; color: var(--g-muted); }
.gm-end-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
.gm-end-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gm-end-row .gm-btn { padding: 10px 8px; font-size: 0.9rem; }
/* printed confetti */
.gm-end-burst { position: absolute; inset: 0; pointer-events: none; }
.gm-end-burst i { position: absolute; width: 14px; height: 14px; background: var(--p-a); border: var(--g-stroke) solid var(--g-ink); animation: gm-pop 0.7s calc(0.15s + var(--d, 0s)) cubic-bezier(0.2, 1.6, 0.4, 1) both; }
.gm-end-burst i:nth-child(1) { left: -16px; top: 18%; --r: -20deg; border-radius: 50%; background: var(--p-b); }
.gm-end-burst i:nth-child(2) { left: 22%; top: -14px; --r: 30deg; background: var(--g-hl); --d: 0.04s; }
.gm-end-burst i:nth-child(3) { right: 18%; top: -18px; --r: 45deg; width: 0; height: 0; border-width: 0 9px 15px 9px; border-color: transparent transparent var(--p-a) transparent; background: none; --d: 0.08s; }
.gm-end-burst i:nth-child(4) { right: -15px; top: 30%; --r: 15deg; border-radius: 50%; background: var(--g-hl); --d: 0.02s; }
.gm-end-burst i:nth-child(5) { right: -20px; bottom: 26%; --r: -35deg; width: 20px; height: 8px; border-radius: 4px; background: var(--p-b); --d: 0.1s; }
.gm-end-burst i:nth-child(6) { left: -20px; bottom: 30%; --r: 60deg; width: 22px; height: 8px; border-radius: 4px; background: var(--p-a); --d: 0.06s; }
.gm-end-burst i:nth-child(7) { left: 8%; bottom: -16px; --r: 10deg; border-radius: 50%; width: 10px; height: 10px; background: var(--p-b); --d: 0.12s; }
.gm-end-burst i:nth-child(8) { right: 30%; bottom: -15px; --r: -12deg; background: var(--g-hl); --d: 0.03s; }
.gm-end-burst i:nth-child(9) { left: 52%; top: -13px; --r: 0deg; border-radius: 50%; width: 9px; height: 9px; background: var(--g-ink); border: 0; --d: 0.09s; }
.gm-end-burst i:nth-child(10) { right: -9px; top: -11px; --r: 20deg; width: 16px; height: 16px; background: var(--p-b); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); border: 0; --d: 0.14s; }

/* menu sheet */
.gm-sheet { position: fixed; inset: 0; z-index: 8; display: grid; align-items: end; justify-items: center; padding: calc(70px + env(safe-area-inset-top, 0px)) 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--g-dim); animation: gm-fade 0.2s ease-out both; }
.gm-sheet-card { width: min(100%, 480px); display: flex; flex-direction: column; gap: 12px; padding: 18px 18px 18px; background: var(--g-card); color: var(--g-ink); border: 2.5px solid var(--g-ink); border-radius: 16px; box-shadow: var(--g-shadow-lg); animation: gm-up 0.32s cubic-bezier(0.2, 1.2, 0.4, 1) both; max-height: 100%; overflow-y: auto; }
.gm-sheet-h { font-family: var(--g-font-display); font-weight: 900; font-size: 1.55rem; line-height: 1.05; margin-top: -4px !important; }
.gm-sheet-actions { display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
.gm-sheet-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.gm-howto { list-style: none; counter-reset: step; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; text-align: left; }
.gm-howto li { counter-increment: step; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 0.97rem; line-height: 1.38; font-weight: 500; }
.gm-howto li::before { content: counter(step); width: 26px; height: 26px; margin-top: -2px; display: grid; place-items: center; border-radius: 50%; border: var(--g-stroke) solid var(--g-ink); background: var(--g-bg); font: 900 0.72rem/1 var(--g-font-display); }

const E = (cx, cy, rx, ry, f, k, sw, ex = '', rot = 0) => `<ellipse cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(rx)}" ry="${f1(ry)}"${rot ? ` transform="rotate(${rot} ${f1(cx)} ${f1(cy)})"` : ''}${st(f, k, sw, ex)}/>`;
const P = (d, f, k, sw, ex = '') => `<path d="${d}"${st(f, k, sw, ex)}/>`;
const L = (d, k = 'k', sw = 2.5, ex = '') => P(d, 'n', k, sw, ex);
const G = (tr, body) => `<g transform="${tr}">${body}</g>`;
const poly = (pts) => 'M' + pts.map(([x, y]) => `${f1(x)} ${f1(y)}`).join('L') + 'Z';
const star = (cx, cy, ro, ri, n = 8, rot = 0) => poly(Array.from({ length: n * 2 }, (_, i) => {
  const r = i % 2 ? ri : ro; const t = (Math.PI * i) / n + (rot * Math.PI) / 180 - Math.PI / 2;
  return [cx + r * Math.cos(t), cy + r * Math.sin(t)];
}));
// halftone: rows of dots (stroke-dasharray trick, so no <pattern>)
function dots(x0, y0, x1, y1, step, ink = 'k', r = 1, op = 1) {
  let d = '';
  for (let y = y0, i = 0; y <= y1; y += step, i++) d += `M${f1(x0 + (i % 2 ? step / 2 : 0))} ${f1(y)}H${f1(x1)}`;
  return `<path d="${d}" style="fill:none;stroke:${c(ink)};stroke-width:${r * 2};stroke-dasharray:0 ${step};stroke-linecap:round;opacity:${op}"/>`;
}
const svg = (bg, body) => `<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="stroke-linejoin:round;stroke-linecap:round">${R(0, 0, 160, 100, bg)}${body}</svg>`;

// isometric cube: top-face centre (cx, cy), edge e; returns faces
function cube(cx, cy, e, top, left, right, sw = 2.2) {
  const h = 0.5 * e, w = 0.866 * e;
  const T = [[cx, cy - h], [cx + w, cy], [cx, cy + h], [cx - w, cy]];
  const Lf = [[cx - w, cy], [cx, cy + h], [cx, cy + h + e], [cx - w, cy + e]];
  const Rf = [[cx, cy + h], [cx + w, cy], [cx + w, cy + e], [cx, cy + h + e]];
  return P(poly(Lf), left, 'k', sw) + P(poly(Rf), right, 'k', sw) + P(poly(Rf), 'k', 'n', 0, 'opacity:.22') + P(poly(T), top, 'k', sw);
}
// a little running figure with outlined limbs
function runner(x, y, s, ink, flip = 1) {
  const p = (dx, dy) => `${f1(x + dx * s * flip)} ${f1(y + dy * s)}`;
  const limbs = `M${p(-3, 2)}L${p(-9, 9)}L${p(-6, 15)}M${p(-3, 2)}L${p(2, 9)}L${p(8, 10)}M${p(1, -10)}L${p(-6, -5)}L${p(-10, -9)}M${p(1, -10)}L${p(7, -5)}L${p(9, 0)}M${p(1, -10)}L${p(-3, 2)}`;
  return L(limbs, 'k', 7.4 * s) + L(limbs, ink, 3.6 * s) + C(x + 3 * s * flip, y - 16 * s, 4.6 * s, ink, 'k', 2);
}

  const row = (y, fills, flipAt = -1) => fills.map((f, i) => tile(27 + i * 22, y, f, i === flipAt)).join('');
  const glyph = (x, y, k) => [
    P(`M${x + 9} ${y + 4.5}L${x + 13.5} ${y + 13}H${x + 4.5}Z`, 'k'),

  const g2 = [2, 0, 1, 3, 0].map((k, i) => (i === 3 ? '' : glyph(27 + i * 22, 33, k))).join('');
  let keys = '';

  const seed = rematchOf && mode !== 'local' ? hash('seed', rematchOf) % 2147483647 : Math.floor(Math.random() * 2147483647);
  const base = { game: gameId, first: f, seed, by: me(), created: Date.now(), opts: {} };
  if (mode === 'local' || !G.db) {
    const id = 'l' + newId(11);
    G.local[id] = { id, online: false, ...base, lists: { a: [], b: [] }, ua: 0, ub: 0 };
    persistLocal();
    return id;
  }
  const id = rematchOf ? rematchIdOf(rematchOf) : newId(12);
  if (rematchOf) {
    // Already made by the partner? Join it instead of overwriting it.
    if (G.online[id]) return id;
    try { const snap = await G.db.doc(`matches/${id}`).get(); if (snap.exists) { G.online[id] = normalize(id, snap.data()); return id; } } catch { /* make it */ }
    if (G.online[id]) return id;
  }
  const doc = { ...base, a: '[]', b: '[]', ua: 0, ub: 0 };
  G.online[id] = normalize(id, doc);
  G.creating[id] = G.online[id];
  try {
    await G.db.doc(`matches/${id}`).set(doc);
  } catch (e) {
    delete G.online[id];
    delete G.creating[id];
    toast(e && e.code === 'invalid_argument' ? 'You can’t start games yet. Ask for Editor access.' : 'Couldn’t start the game. Try again.');
    return null;
  }
  ping(id, { new: gameId });
  return id;
}

async function endMatch(id, { resign = false } = {}) {
  const m = getMatch(id);
  if (!m) return;
  const def = BY_ID[m.game];
  const d = derived(m);
  // Resigning an online versus game is a loss. Ending a same-device or co-op game just deletes it.
  if (resign && m.online && d && !d.over && !def.team) recordResult(id, m.game, { winner: other(me()) }, 'online');
  if (m.online) {
    G.deleted[id] = Date.now();
    delete G.online[id];
    delete G.pending[id];
    delete G.creating[id];
    try { await G.db.doc(`matches/${id}`).delete(); } catch { /* ignore */ }
    ping(id, { gone: true, r: resign && d && !d.over && !def.team ? 1 : 0 });
  } else {
    delete G.local[id];
    persistLocal();
  }
  changed();
}

// ── results / records ─────────────────────────────────────────────────
function recordResult(id, gameId, res, mode) {
  if (G.results[id] || G.recording[id]) return;
  const def = BY_ID[gameId];
  const winner = res.team || def?.team ? 'team' : res.winner === 'a' || res.winner === 'b' ? res.winner : 'draw';
  const rec = { game: gameId, winner, score: Number.isFinite(res.score) ? res.score : null, at: Date.now(), mode };
  G.recording[id] = true;
  G.results[id] = rec;
  if (G.db) G.db.doc(`results/${id}`).set(rec).catch(() => { delete G.recording[id]; });
  else lsSet(LS_RESULTS, G.results);
}

function gameRecord(gameId) {
  const r = { a: 0, b: 0, draw: 0, best: null, plays: 0 };
  for (const x of Object.values(G.results)) {
    if (gameId && x.game !== gameId) continue;
    r.plays++;
    if (x.winner === 'a') r.a++;
    else if (x.winner === 'b') r.b++;
    else if (x.winner === 'team') { if (x.score != null) r.best = Math.max(r.best ?? -Infinity, x.score); }
    else r.draw++;
  }
  return r;
}

function recordFinished() {
  // Online, wait until both lists are in: otherwise every finished match looks unrecorded
  // and gets its result written again on every load.
  if (G.db && !(G.loaded.matches && G.loaded.results)) return;
  for (const m of allMatches()) {
    const d = derived(m);
    if (d && d.over && !d.broken && !G.results[m.id]) recordResult(m.id, m.game, d.result, m.online ? 'online' : 'local');
  }
}

// Finished online matches are kept (newest 25) so they can be looked at again; older ones go.
// Their results stay in results/. Runs once per visit, after both lists have loaded.
async function cleanup() {
  if (!G.db || G.cleaned || !(G.loaded.matches && G.loaded.results)) return;
  G.cleaned = true;
  const done = Object.values(G.online).filter((m) => { const d = derived(m); return d && d.over && G.results[m.id]; })
    .sort((x, y) => y.created - x.created);
  for (const m of done.slice(25)) {
    G.deleted[m.id] = Date.now();
    delete G.online[m.id];
    try { await G.db.doc(`matches/${m.id}`).delete(); } catch { delete G.deleted[m.id]; }
    await new Promise((r) => setTimeout(r, 150)); // one write at a time, gently
  }
}

// ── sound + haptics + 3D ──────────────────────────────────────────────
let actx = null;
const muted = () => !!lsGet(LS_MUTE, false);
const NOTES = {
  tap: [[880, 0.035, 'triangle', 0.12]],
  place: [[196, 0.09, 'sine', 0.35], [294, 0.07, 'sine', 0.2]],
  flip: [[520, 0.04, 'square', 0.06], [780, 0.04, 'square', 0.05]],
  good: [[523, 0.07], [659, 0.07], [784, 0.12]],
  bad: [[180, 0.18, 'sawtooth', 0.12]],
  win: [[523, 0.09], [659, 0.09], [784, 0.09], [1047, 0.28]],
  lose: [[392, 0.14], [330, 0.14], [262, 0.3]],
  tick: [[1400, 0.018, 'square', 0.05]],
  hit: [[140, 0.06, 'square', 0.25], [90, 0.05, 'sine', 0.3]],
  pop: [[700, 0.05, 'sine', 0.25], [1100, 0.04, 'sine', 0.15]],
};
/** The shared WebAudio context (created on demand, unlocked on the first touch).
 *  Games that synthesize their own sound should use this instead of making their own.
 *  Returns null if audio isn't available. Check muted() before making noise. */
function audio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume().catch(() => {});
    return actx;
  } catch { return null; }
}
if (typeof document !== 'undefined') {
  // iOS only lets audio start inside a user gesture: unlock once on the first touch/click.
  const unlock = () => {
    const ctx = audio();
    if (ctx) {
      try { const b = ctx.createBuffer(1, 1, 22050); const s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0); } catch { /* ignore */ }
    }
    if (ctx && ctx.state === 'running') ['touchend', 'pointerup', 'keydown'].forEach((t) => document.removeEventListener(t, unlock, true));
  };
  ['touchend', 'pointerup', 'keydown'].forEach((t) => document.addEventListener(t, unlock, true));
}

/** Play a short synth sound: tap, place, flip, good, bad, win, lose, tick, hit, pop. */
function sfx(name) {
  if (muted()) return;
  const seq = NOTES[name];
  if (!seq) return;
  try {
    if (!audio()) return;
    let t = actx.currentTime + 0.005;
    for (const [f, d, type = 'triangle', vol = 0.18] of seq) {
      const o = actx.createOscillator(); const g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.02);
      t += d * 0.85;
    }
  } catch { /* no audio */ }
}
function haptic(ms = 12) { try { navigator.vibrate && navigator.vibrate(ms); } catch { /* ignore */ } }

/** Resolved theme colours for canvas / WebGL drawing. Call again after a theme change. */
function tokens(el = document.documentElement) {
  const cs = getComputedStyle(el);
  const v = (n) => cs.getPropertyValue(n).trim();
  return {
    a: v('--p-a'), b: v('--p-b'), aSoft: v('--p-a-soft'), bSoft: v('--p-b-soft'),
    bg: v('--g-bg'), card: v('--g-card'), ink: v('--g-ink'), muted: v('--g-muted'), line: v('--g-line'),
    hl: v('--g-hl'), good: v('--g-good'), bad: v('--g-bad'), onInk: v('--g-on-ink') || '#fff',
    hlSoft: v('--g-hl-soft'), edge: v('--g-edge'), white: v('--g-white'), aText: v('--p-a-text'), bText: v('--p-b-text'),
    fontDisplay: v('--g-font-display'), fontBody: v('--g-font-body'),
    dark: matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light' || document.documentElement.dataset.theme === 'dark',
  };
}

let threeP = null;
/** Load three.js r128 (global THREE). Resolves THREE; rejects if it can't load. */
function loadThree() {
  if (window.THREE) return Promise.resolve(window.THREE);
  if (!threeP) {
    threeP = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = THREE_URL;
      s.onload = () => (window.THREE ? res(window.THREE) : rej(new Error('3D engine missing')));
      s.onerror = () => { threeP = null; rej(new Error('Couldn’t load the 3D engine')); };
      document.head.appendChild(s);
    });
  }
  return threeP;
}

// ── init + sync ───────────────────────────────────────────────────────
async function initGames(store, hooks = {}) {
  G.store = store;
  Object.assign(G.hooks, hooks);
  G.local = lsGet(LS_LOCAL, {}) || {};
  for (const [id, m] of Object.entries(G.local)) if (!m || !m.lists || !BY_ID[m.game]) delete G.local[id];
  if (store.mode === 'artifact' && store.adb) {
    G.db = store.adb;
    const watch = (make, fn) => (store.watch ? store.watch(make, fn) : make().onSnapshot(fn, (e) => console.warn('games sync', e)));
    const isCache = (qs) => !!(qs.metadata && qs.metadata.fromCache);
    watch(() => G.db.collection('matches'), (qs) => {
      if (isCache(qs) && qs.empty) return; // a cold cache knows nothing yet
      const next = {};
      qs.docs.forEach((d) => { if (d.exists && !G.deleted[d.id]) next[d.id] = normalize(d.id, d.data()); });
      // A match we just created can be missing from a snapshot taken before our write landed.
      for (const [id, m] of Object.entries(G.creating)) {
        if (next[id] || Date.now() - m.created > 20000) delete G.creating[id];
        else next[id] = m;
      }
      for (const [id, t] of Object.entries(G.deleted)) if (!next[id] && Date.now() - t > 60000) delete G.deleted[id];
      G.online = next;
      if (!isCache(qs)) G.loaded.matches = true;
      for (const id of Object.keys(G.pending)) healPending(id);
      recordFinished();
      cleanup();
      changed();
    });
    watch(() => G.db.collection('results'), (qs) => {
      if (isCache(qs) && qs.empty) return;
      const next = {};
      qs.docs.forEach((d) => { if (d.exists) next[d.id] = d.data(); });
      for (const [id, r] of Object.entries(G.results)) if (!next[id] && G.recording[id]) next[id] = r;
      G.results = next;
      if (!isCache(qs)) G.loaded.results = true;
      recordFinished();
      cleanup();
      changed();
    });
    try { G.room = await globalThis.claude.use('room'); } catch { G.room = null; }
    if (G.room) wireRoom();
  } else {
    G.results = lsGet(LS_RESULTS, {}) || {};
  }
  recordFinished();
  changed();
}

function wireRoom() {
  const r = G.room;
  setPresence();
  r.onPeers((ch) => {
    const p = ch.peers.find((x) => !x.isMe && x.presence && x.presence.who === other(me()));
    const here = !!p;
    const at = p ? p.presence.at || null : null;
    if (here !== G.partner.here || at !== G.partner.at) { G.partner = { here, at }; changed(); }
    const inv = p && p.presence.inv;
    if (inv && typeof inv === 'object') seeInvite(inv);
    else if (G.invite && G.invite.t) { // they stopped waiting
      G.invite = null; document.getElementById('gm-invite')?.remove(); changed();
    }
  }, () => {});
  r.on('ping', (msg) => {
    if (msg.isMe) return;
    const d = msg.data || {};
    if (d.to && d.to !== me()) return;
    if (typeof d.m !== 'string' || !/^[a-z0-9]{6,20}$/.test(d.m)) return;
    if (d.gone) {
      const gm = G.online[d.m];
      const viewing = G.screen && G.screen.id === d.m;
      delete G.online[d.m];
      G.deleted[d.m] = Date.now();
      if (gm && !viewing && BY_ID[gm.game]) toast(d.r ? `${nameOf(other(me()))} resigned ${BY_ID[gm.game].title}. You win.` : `${nameOf(other(me()))} ended your game of ${BY_ID[gm.game].title}.`);
      if (viewing && d.r) G.goneNote = 'resigned';
      changed();
      return;
    }
    refetch(d.m);
    const viewing = G.screen && G.screen.id === d.m;
    if (d.new && G.screen && G.screen.offerRematch && G.screen.game === d.new && G.screen.id !== d.m) {
      const cur = getMatch(G.screen.id);
      const cd = cur && derived(cur);
      if (cd && cd.over) { G.screen.offerRematch(d.m); return; }
    }
    if (!viewing) {
      const def = BY_ID[d.new || G.online[d.m]?.game];
      if (def) toast(d.new ? `${nameOf(other(me()))} started ${def.title}` : `${nameOf(other(me()))} moved in ${def.title}`);
    }
  }, () => {});
  r.on('invite', (msg) => {
    if (msg.isMe) return;
    const d = msg.data || {};
    if (d.to !== me() || !BY_ID[d.game]) return;
    seeInvite({ game: d.game, t: d.t || Date.now() });
  }, () => {});
}

/** The app switched who's on this device: re-announce, and redraw with the new perspective. */
function gamesIdentityChanged() {
  if (G.screen) closeScreen();
  setPresence(null);
  G.partner = { here: false, at: null };
  G.invite = null;
  document.getElementById('gm-invite')?.remove();
  changed();
}

function setPresence(at = null, inv = null) {
  if (!G.room || !me()) return;
  // `inv` mirrors an open live invite in presence, which the platform always re-delivers,
  // so a dropped 'invite' event can't leave the partner unaware.
  G.room.presence({ who: me(), at, inv }).catch(() => {});
}

function seeInvite(inv) {
  if (!inv || !BY_ID[inv.game]) return;
  if (G.screen && G.screen.live && G.screen.game === inv.game) return;
  if (G.invite && G.invite.game === inv.game && G.invite.t === inv.t) return;
  if (G.dismissedInvite === inv.t) return;
  G.invite = { game: inv.game, at: Date.now(), t: inv.t };
  showInvite();
  changed();
}

// ── DOM roots ─────────────────────────────────────────────────────────
function gameRoot() {
  let el = document.getElementById('game-root');
  if (!el) { el = document.createElement('div'); el.id = 'game-root'; el.hidden = true; document.body.appendChild(el); }
  return el;
}
// iOS scrolls the page behind a fixed overlay whenever the overlay itself has nothing to
// scroll, and overflow: hidden on <body> doesn't stop it. So the page is pinned in place
// (position: fixed at its current offset) while the game room is open, and put back after.
let pinnedY = null;
function showRoot(on) {
  const r = gameRoot();
  r.hidden = !on;
  const b = document.body;
  b.classList.toggle('gm-open', on);
  if (on) document.querySelectorAll('.toast').forEach((t) => t.remove()); // the hub's news is old now
  if (on && pinnedY === null) {
    pinnedY = window.scrollY || 0;
    b.style.top = `-${pinnedY}px`;
    b.classList.add('gm-pinned');
  } else if (!on && pinnedY !== null) {
    const y = pinnedY;
    pinnedY = null;
    b.classList.remove('gm-pinned');
    b.style.top = '';
    window.scrollTo(0, y);
  }
}

function closeScreen() {
  const s = G.screen;
  G.screen = null;
  if (s) { try { s.close(); } catch (e) { console.error(e); } }
  const r = gameRoot();
  r.innerHTML = '';
  showRoot(false);
  setPresence(null);
  G.hooks.onChange();
}

function showInvite() {
  const inv = G.invite;
  document.getElementById('gm-invite')?.remove();
  if (!inv) return;
  const def = BY_ID[inv.game];
  const el = document.createElement('div');
  el.id = 'gm-invite';
  el.className = `gm-invite p-${other(me())}`;
  el.setAttribute('role', 'status');
  el.innerHTML = `<div class="gm-invite-ticket">
      <span class="gm-invite-cover" aria-hidden="true">${def.cover || ''}</span>
      <div class="gm-invite-txt"><span class="gm-invite-kicker">Live invite</span><span><b>${esc(nameOf(other(me())))}</b> wants to play <b>${esc(def.title)}</b></span></div>
      <div class="gm-invite-btns"><button class="gm-btn gm-btn-ghost" data-g="invite-no">Not now</button><button class="gm-btn" data-g="invite-yes">Join</button></div>
    </div>`;
  document.body.appendChild(el);
  clearTimeout(showInvite.t);
  showInvite.t = setTimeout(() => { if (G.invite === inv) { G.invite = null; el.remove(); G.hooks.onChange(); } }, 90000);
}
