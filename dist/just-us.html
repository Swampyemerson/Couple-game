  computer: '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="2.75" y="2.75" width="10.5" height="7.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M1 13.25h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
};

// ── devices ───────────────────────────────────────────────────────────
// def.platforms: where a game can be played (default both); def.best: where it shines;
// def.modes: which start buttons to offer.
const DEVICE_NAME = { phone: 'Phone', computer: 'Computer' };
const thisDevice = () => (typeof matchMedia !== 'undefined' && matchMedia('(pointer: coarse)').matches ? 'phone' : 'computer');
const platformsOf = (def) => {
  const p = (Array.isArray(def.platforms) ? def.platforms : []).filter((x) => x === 'phone' || x === 'computer');
  return p.length ? p : ['phone', 'computer'];
};
const modesOf = (def) => {
  const ok = def.kind === 'live' ? ['live', 'local'] : ['online', 'local'];
  const m = (Array.isArray(def.modes) ? def.modes : []).filter((x) => ok.includes(x));
  return m.length ? m : ok;
};
function devicesHTML(def, { labels = false } = {}) {
  const pl = platformsOf(def);
  const best = pl.length > 1 && pl.includes(def.best) ? def.best : null;
  return `<span class="g-devices" aria-label="Plays on ${pl.map((p) => DEVICE_NAME[p].toLowerCase()).join(' and ')}${best ? `, best on ${best === 'phone' ? 'a phone' : 'a computer'}` : ''}">${pl.map((p) => `<span class="g-device${p === best ? ' is-best' : ''}">${ICON[p]}${labels ? `<span>${DEVICE_NAME[p]}</span>` : ''}</span>`).join('')}</span>`;
}

// ── turn-game screen ──────────────────────────────────────────────────
function openMatch(id) {
  const m0 = getMatch(id);
  if (!m0) { toast('That game is gone.'); return; }
  const def = BY_ID[m0.game];
  if (G.screen) closeScreen();
  if (typeof window !== 'undefined') window.__lastMatchId = id;
  const root = gameRoot();
  root.innerHTML = chromeHTML(def);
  showRoot(true);
  setPresence(def.id);
  const $ = (s) => root.querySelector(s);
  const stage = $('.gm-stage');
  let customStatus = null;
  let revealedFor = null; // local hidden games: whose secrets are showing
  let lastKey = '';
  let endShown = false;
  let endDismissed = false;
  let ctxNow = null;
  let openedOver = null; // was the match already over when this screen opened?

  const screen = {
    id, game: def.id, live: false, actor: null,
    refresh: () => paint(),
    close: () => { try { inst && inst.destroy && inst.destroy(); } catch (e) { console.error(e); } },
    toggleMenu() {
      const sh = $('.gm-sheet');
      if (!sh.hidden) { sh.hidden = true; return; }
      const m = getMatch(id); const d = m && derived(m);
      sh.innerHTML = menuHTML(def, { live: false, online: !!m?.online, over: !!d?.over, team: !!def.team });
      sh.hidden = false;
    },
    reveal() {
      // ctx.actor is hidden while the curtain is up, so read the real next player.
      const m = getMatch(id); const d = m && derived(m);
      revealedFor = d && !d.over ? d.acts[0] || null : null;
      lastKey = '';
      paint();
    },
    look() { endDismissed = true; $('.gm-end').hidden = true; paintStatus(); try { inst && inst.onEndClosed && inst.onEndClosed(); } catch (e) { console.error(e); } },
    reshowEnd() { if (!endShown) return; endDismissed = false; $('.gm-end').hidden = false; paintStatus(); },
    get endOpen() { return !$('.gm-end').hidden; },
    showEnd: null,
    rematchId: null,
    offerRematch(newMatchId) {
      screen.rematchId = newMatchId;
      const btn = root.querySelector('.gm-end [data-g="rematch"]');
      if (btn) btn.textContent = `Join ${nameOf(other(me()))}’s rematch`;
    },
  };

  function ctxFor(m, d) {
    const local = !m.online;
    let actor = null;
    if (!d.over) {
      if (local) actor = d.acts[0] || null;
      else if (d.acts.includes(me())) actor = me();
    }
    const curtain = local && def.secret && !d.over && actor && revealedFor !== actor;
    const viewer = local ? (def.secret ? (curtain ? null : actor) : (actor || m.first)) : me();
    return {
      state: d.state, prev: d.prev, acts: d.acts, over: d.over, result: d.result, last: d.last, moves: d.count,
      mode: local ? 'local' : 'online', me: local ? null : me(), actor: curtain ? null : actor, viewer,
      canMove: !!actor && !curtain && !d.over, first: m.first, curtain, matchId: id,
    };
  }

  const api = {
    mode: m0.online ? 'online' : 'local',
    me: m0.online ? me() : null,
    names: { a: nameOf('a'), b: nameOf('b') },
    name: nameOf,
    other,
    color: (w) => `var(--p-${w})`,
    move(mv) { return doMove(id, mv, ctxNow && ctxNow.actor); },
    setStatus(t) { customStatus = t == null ? null : String(t); paintStatus(); },
    toast, sfx, haptic, rand, randInt, rng, shuffled, tokens, audio, muted,
    three: loadThree,
    el: stage,
    /** With endDelay: 'manual', show the end card once your finale is done. */
    showEnd() { if (screen.showEnd) screen.showEnd(); },
  };

  let inst = {};
  try { inst = def.mount(stage, api) || {}; } catch (e) { console.error(e); stage.innerHTML = '<p class="gm-error">This game failed to load.</p>'; }

  function paintStatus() {
    const c = ctxNow; if (!c) return;
    if (c.over && endDismissed) { resultStatus($('.gm-status'), def, c.result); return; }
    let text = customStatus;
    if (text == null) {
      if (c.over) text = '';
      else if (c.curtain) text = '';
      else if (c.mode === 'local') text = `${nameOf(c.actor)}’s turn`;
      else if (c.canMove) text = 'Your turn';
      else text = `Waiting for ${nameOf(other(me()))}…`;
    }
    $('.gm-status').textContent = text;
  }

  function paint() {
    const m = getMatch(id);
    if (!m) {
      closeScreen();
      const won = G.goneNote === 'resigned' || (G.results[id] && G.results[id].winner === me() && m0.online);
      toast(won ? `${nameOf(other(me()))} resigned. You win.` : 'That game was ended.');
      G.goneNote = null;
      return;
    }
    const d = derived(m);
    const c = ctxFor(m, d);
    ctxNow = c;
    if (openedOver === null) openedOver = d.over;
    screen.actor = c.actor || (c.mode === 'online' ? me() : null);
    // chips
    for (const w of ['a', 'b']) {
      const chip = $(`.gm-p-${w}`);
      chip.classList.toggle('is-turn', !c.over && d.acts.includes(w));
      chip.classList.toggle('is-me', c.mode === 'online' && w === me());
    }
    const sc = !d.broken && def.score ? def.score(d.state) : null;
    for (const w of ['a', 'b']) $(`[data-score="${w}"]`).textContent = sc && sc[w] != null ? sc[w] : '';
    paintStatus();
    // pass-the-phone curtain
    const cur = $('.gm-curtain');
    if (c.curtain) {
      const who = d.acts[0];
      cur.innerHTML = `<div class="gm-curtain-card"><p class="gm-curtain-kicker">Pass the phone</p>
        <div class="gm-curtain-name p-${who}">${esc(nameOf(who))}</div>
        <p>${esc(nameOf(other(who)))}, no peeking.</p>
        <button class="gm-btn" data-g="reveal">I’m ${esc(nameOf(who))}, show me</button></div>`;
      cur.hidden = false;
    } else cur.hidden = true;
    stage.classList.toggle('is-covered', !!c.curtain);
    // The end card is set up before the game's update(), so update() may call api.showEnd().
    const end = $('.gm-end');
    if (d.over && !endShown) {
      endShown = true;
      if (!G.results[id]) recordResult(id, m.game, d.result, m.online ? 'online' : 'local');
      end.innerHTML = endHTML(def, d.result);
      const reveal = () => {
        if (endDismissed || G.screen !== screen || !end.hidden) return;
        end.hidden = false;
        if (m.online) { markEndSeen(id); G.hooks.onChange(); }
        const r = d.result;
        sfx(def.team || r.team ? 'win' : r.winner && (c.mode === 'local' || r.winner === me()) ? 'win' : r.winner ? 'lose' : 'good');
      };
      screen.showEnd = reveal;
      // endDelay: 'manual' lets the game finish its finale and call api.showEnd() (8 s safety net).
      // A match that was already over when opened has had its finale: show the card promptly.
      let delay = def.endDelay === 'manual' ? 8000 : Number.isFinite(def.endDelay) ? def.endDelay : 900;
      if (openedOver) delay = Math.min(delay, 400);
      setTimeout(reveal, delay);
    } else if (!d.over) { endShown = false; endDismissed = false; screen.showEnd = null; end.hidden = true; }
    // game body
    const key = `${m.lists.a.length}|${m.lists.b.length}|${c.viewer}|${c.actor}|${c.curtain}`;
    if (key !== lastKey) {
      lastKey = key;
      try { inst.update && inst.update(c); } catch (e) { console.error(def.id, 'update failed', e); }
    }
  }

  G.screen = screen;
  paint();
}

function doMove(id, mv, actor) {
  const m = getMatch(id);
  if (!m) return { ok: false, error: 'This game is gone.' };
  const def = BY_ID[m.game];
  const d = derived(m);
  if (d.over) return { ok: false, error: 'The game is over.' };
  if (!actor || !d.acts.includes(actor)) return { ok: false, error: 'Not your turn.' };
  let json;
  try { json = JSON.parse(JSON.stringify(mv)); } catch { return { ok: false, error: 'Bad move.' }; }
  try { def.apply(clone(d.state), actor, clone(json)); } catch (e) { return { ok: false, error: String((e && e.message) || e) }; }
  if (m.online) {
    if (actor !== me()) return { ok: false, error: 'Not your turn.' };
    G.pending[id] = [...m.lists[actor], json];
    writeMoves(id);
    ping(id);
  } else {
    G.local[id].lists[actor].push(json);
    G.local[id]['u' + actor] = Date.now();
    persistLocal();
  }
  changed();
  return { ok: true };
}

// ── live-game screen ──────────────────────────────────────────────────
async function openLive(gameId, mode) {
  const def = BY_ID[gameId];
  if (!def) return;
  if (mode === 'live' && !G.room) { toast('Live play only works in the Claude app. You can still play on one device.'); return; }
  if (G.screen) closeScreen();
  const root = gameRoot();
  root.innerHTML = chromeHTML(def, { live: true });
  showRoot(true);
  setPresence(def.id);
  const $ = (s) => root.querySelector(s);
  const stage = $('.gm-stage');
  const evs = {};
  const partnerFns = new Set();
  const hereFns = new Set();
  let nr = null;
  let partnerPeer = null;
  let inst = null;
  let finished = false;
  let customStatus = null;
  const sessionId = newId(8);
  const offs = [];
  // Round generation: bumps on every rematch. finish/rematch are mirrored in presence
  // ({ gen, fin }) so they survive dropped events; events stay as the fast path.
  let gen = 0;
  let recordedGen = -1;
  let invT = 0;
  let lastPresence = null; // the partner presence object we last handed to onPartnerState
  let lastRes = null;
  let endDismissed = false;
  // The partner's game state, if it belongs to this round. setPresence stamps `sg` (state
  // generation), so a previous round's state left in presence never leaks into a rematch.
  const stateOf = (pr) => (pr && (Number.isInteger(pr.sg) ? pr.sg : 0) === gen ? pr.s ?? null : null);

  const screen = {
    id: null, game: gameId, live: true, mode,
    refresh() {},
    close() {
      try { inst && inst.destroy && inst.destroy(); } catch (e) { console.error(e); }
      offs.forEach((f) => { try { f(); } catch { /* ignore */ } });
      if (nr) { nr.presence({ on: false, s: null }).catch(() => {}); nr.leave().catch(() => {}); }
    },
    toggleMenu() {
      const sh = $('.gm-sheet');
      if (!sh.hidden) { sh.hidden = true; return; }
      sh.innerHTML = menuHTML(def, { live: true });
      sh.hidden = false;
    },
    rematch() {
      if (mode === 'live') {
        const pg = partnerPeer && Number.isInteger(partnerPeer.presence.gen) ? partnerPeer.presence.gen : 0;
        gen = Math.max(gen, pg) + 1;
        nr.presence({ gen, fin: null, s: null, sg: gen }).catch(() => {});
        api.send('__rematch', { g: gen });
      }
      restart();
    },
    look() { endDismissed = true; $('.gm-end').hidden = true; paintStatus(); try { inst && inst.onEndClosed && inst.onEndClosed(); } catch (e) { console.error(e); } },
    reshowEnd() { if (!finished) return; endDismissed = false; $('.gm-end').hidden = false; paintStatus(); },
    get endOpen() { return !$('.gm-end').hidden; },
  };

  const api = {
    mode, kind: 'live',
    me: mode === 'live' ? me() : null,
    isHost: mode === 'local' || me() === 'a',
    names: { a: nameOf('a'), b: nameOf('b') },
    name: nameOf, other,
    color: (w) => `var(--p-${w})`,
    toast, sfx, haptic, rand, randInt, rng, shuffled, tokens, audio, muted,
    three: loadThree,
    el: stage,
    get partnerHere() { return mode === 'local' || !!partnerPeer; },
    /** This round's number: 0, then +1 on every rematch. */
    get gen() { return gen; },
    setPresence(obj) { if (nr) nr.presence({ s: obj, sg: gen }).catch(() => {}); },
    partnerState() { return partnerPeer ? stateOf(partnerPeer.presence) : null; },
    onPartnerState(fn) { partnerFns.add(fn); return () => partnerFns.delete(fn); },
    onPartnerHere(fn) { hereFns.add(fn); return () => hereFns.delete(fn); },
    send(type, data) { if (nr) nr.emit('ev', { t: String(type), d: data ?? null, s: sessionId }).catch(() => {}); },
    on(type, fn) { (evs[type] = evs[type] || new Set()).add(fn); return () => evs[type].delete(fn); },
    setStatus(t) { customStatus = t == null ? null : String(t); paintStatus(); },
    setScore(sc) { for (const w of ['a', 'b']) $(`[data-score="${w}"]`).textContent = sc && sc[w] != null ? sc[w] : ''; },
    finish(result) {
      if (finished) return;
      finished = true;
      const res = clone(result || { winner: null });
      if (mode === 'local') recordResult('v' + newId(11), gameId, res, mode);
      else {
        // Either side may finish: the host records; the guest's finish is forwarded to it.
        if (api.isHost) recordLive(res);
        nr.presence({ fin: { g: gen, res, by: me() } }).catch(() => {});
        api.send(api.isHost ? '__finish' : '__gfin', { g: gen, res });
      }
      showEnd(res);
    },
  };

  function paintStatus() {
    if (finished && endDismissed && lastRes) { resultStatus($('.gm-status'), def, lastRes); return; }
    let text = customStatus;
    if (text == null) text = mode === 'local' ? `One ${thisDevice()}, two players` : partnerPeer ? '' : `Waiting for ${nameOf(other(me()))}…`;
    $('.gm-status').textContent = text;
  }

  function recordLive(res) {
    if (recordedGen === gen) return;
    recordedGen = gen;
    recordResult('v' + newId(11), gameId, res, mode);
  }
  // A finish from the partner (event or presence) for the current round.
  function partnerFinished(g, res, fromGuest) {
    if (g !== gen) return;
    if (fromGuest && api.isHost) recordLive(res);
    if (finished) return;
    finished = true;
    if (fromGuest && api.isHost) nr.presence({ fin: { g: gen, res, by: me() } }).catch(() => {});
    showEnd(res || { winner: null });
  }
  function partnerRematch(g) {
    if (!Number.isInteger(g) || g <= gen) return;
    gen = g;
    nr.presence({ gen, fin: null, s: null, sg: gen }).catch(() => {});
    restart();
  }

  function showEnd(res) {
    const end = $('.gm-end');
    lastRes = res;
    endDismissed = false;
    end.innerHTML = endHTML(def, res);
    end.hidden = false;
    paintStatus();
    const won = def.team || res.team || (mode === 'local' ? !!res.winner : res.winner === me());
    sfx(won ? 'win' : res.winner ? 'lose' : 'good');
  }

  function mountGame() {
    finished = false;
    endDismissed = false;
    lastRes = null;
    lastPresence = null;
    $('.gm-end').hidden = true;
    paintStatus();
    stage.innerHTML = '';
    try { inst = def.mount(stage, api) || {}; } catch (e) { console.error(e); stage.innerHTML = '<p class="gm-error">This game failed to load.</p>'; inst = {}; }
  }
  function restart() {
    try { inst && inst.destroy && inst.destroy(); } catch (e) { console.error(e); }
    inst = null;
    mountGame();
  }

  function setWaiting(on, dropped = false) {
    const w = $('.gm-wait');
    if (on) {
      const pn = esc(nameOf(other(me())));
      w.innerHTML = `<div class="gm-wait-card"><div class="gm-wait-pulse" aria-hidden="true"></div>
        <p><b>${dropped ? `${pn} stepped away` : `Waiting for ${pn}`}</b></p>
        <p class="gm-wait-sub">${dropped ? 'The game carries on when they’re back.' : 'We sent an invite. This starts as soon as they open it.'}</p>
        <button class="gm-btn gm-btn-ghost" data-g="invite-again">${dropped ? 'Invite them back' : 'Send the invite again'}</button>
        <button class="gm-btn gm-btn-ghost gs-close" data-g="close">Leave</button></div>`;
      w.hidden = false;
    } else w.hidden = true;
  }

  G.screen = screen;
  for (const w of ['a', 'b']) $(`.gm-p-${w}`).classList.toggle('is-me', mode === 'live' && w === me());

  if (mode === 'local') {
    paintStatus();
    mountGame();
    return;
  }

  try { nr = await G.room.join(`ju-${gameId}`); } catch (e) {
    toast('Couldn’t connect for live play. Try again in a moment.');
    closeScreen();
    return;
  }
  if (G.screen !== screen) { nr.leave().catch(() => {}); return; }
  nr.presence({ who: me(), on: true, s: null, sg: gen, gen, fin: null }).catch(() => {});
  const invite = () => {
    invT = Date.now();
    setPresence(def.id, { game: gameId, t: invT });
    G.room.emit('invite', { to: other(me()), game: gameId, t: invT }).catch(() => {});
  };
  screen.inviteAgain = () => { invite(); toast('Invite sent'); };
  invite();
  setWaiting(true);
  paintStatus();

  const findPartner = (peers) => peers.find((p) => !p.isMe && p.presence && p.presence.who === other(me()) && p.presence.on) || null;
  offs.push(nr.onPeers((ch) => {
    const p = findPartner(ch.peers);
    const was = !!partnerPeer;
    partnerPeer = p;
    if (!!p !== was) {
      hereFns.forEach((fn) => { try { fn(!!p); } catch (e) { console.error(e); } });
      if (p) setPresence(def.id, null); // they're here: withdraw the invite
      if (p && !inst) { setWaiting(false); mountGame(); }
      else if (!p && inst && !finished) { if (!def.ownsPauseUI) setWaiting(true, true); } // the game may show its own pause card
      else if (p) setWaiting(false);
      for (const w of ['a', 'b']) $(`.gm-p-${w}`).classList.toggle('is-away', w === other(me()) && !p);
      paintStatus();
    }
    if (p) {
      const pr = p.presence;
      if (Number.isInteger(pr.gen) && pr.gen > gen && inst) partnerRematch(pr.gen);
      if (pr.fin && typeof pr.fin === 'object' && pr.fin.g === gen && pr.fin.by === other(me())) partnerFinished(pr.fin.g, pr.fin.res, other(me()) !== 'a');
      // Only when the partner's presence really changed (peers are frozen, and an unchanged
      // one is the same object), and only state from this round.
      if (pr !== lastPresence) {
        const prevState = stateOf(lastPresence);
        lastPresence = pr;
        const st = stateOf(pr);
        if (st !== null && st !== prevState) partnerFns.forEach((fn) => { try { fn(st); } catch (e) { console.error(e); } });
      }
    } else lastPresence = null;
  }, () => {}));
  offs.push(nr.on('ev', (msg) => {
    if (msg.isMe) return;
    const d = msg.data || {};
    if (d.t === '__rematch') { partnerRematch(d.d && d.d.g); return; }
    if (d.t === '__finish') { partnerFinished(d.d && d.d.g, d.d && d.d.res, false); return; }
    if (d.t === '__gfin') { partnerFinished(d.d && d.d.g, d.d && d.d.res, true); return; }
    (evs[d.t] || []).forEach((fn) => { try { fn(d.d, msg); } catch (e) { console.error(e); } });
  }, () => {}));
}

// ── hub ───────────────────────────────────────────────────────────────
const FILTERS = [
  ['all', 'All'], ['versus', 'Versus'], ['coop', 'Together'], ['brainy', 'Brainy'], ['silly', 'Silly'], ['live', 'Live'],
  ['phone', 'Phone'], ['computer', 'Computer'],
];

// The hub's shelves, top to bottom. With no filter on, every listed game sits on exactly one
// shelf; SHELF_OF (keyed by game id) also sets the order inside a shelf. Unknown ids → "More".
const SHELVES = [
  ['featured', 'Featured', 'The big ones. Both of you, right now.'],
  ['quick', 'Quick ones', 'Five minutes, start to finish.'],
  ['brainy', 'Big brain', 'Slow, sneaky, satisfying.'],
  ['together', 'Together', 'Same side. Win or lose as two.'],
  ['live', 'Live: grab your partner', 'Real time. Phones out.'],
  ['computer', 'On a computer', 'Keyboards and big screens.'],
  ['more', 'More', ''],
];
const SHELF_OF = {
  rush: 'featured', chameleon: 'featured',
  four: 'quick', bones: 'quick', dots: 'quick', doodle: 'quick',
  ultimate: 'brainy', fleet: 'brainy', wordduel: 'brainy',
  agents: 'together', wave: 'together', tower: 'together',
  hockey: 'live', quickdraw: 'live',
  cycles: 'computer', defuse: 'computer',
};
const SHELF_RANK = Object.fromEntries(Object.keys(SHELF_OF).map((id, i) => [id, i]));

function matchRow(m) {
  const def = BY_ID[m.game];
  const d = derived(m);
  let note = '';
  if (d.over) {
    const r = d.result || {};
    const note2 = def.team || r.team ? 'Finished together' : r.winner === me() ? 'You won' : r.winner ? `${esc(nameOf(r.winner))} won` : 'A draw';
    return `<button class="gh-row is-done${r.winner === 'a' || r.winner === 'b' ? ` t-${r.winner}` : ''}" data-g="open" data-id="${esc(m.id)}">
    <span class="gh-row-cover" aria-hidden="true">${def.cover || ''}</span>
    <span class="gh-row-main"><span class="gh-row-title">${esc(def.title)}</span><span class="gh-row-sub"><span class="gh-row-note">${note2}</span><span class="gh-row-ago">${ago(Math.max(m.ua || 0, m.ub || 0, m.created || 0))}</span></span></span>

  const railGap = (x) => Math.abs(x - TRACK_X) - 4;
  const culs = [];
  const sproutFrom = roads.filter((r) => r.res && !r.weston && r.name !== 'Mobile Home Way' && r.name !== 'Fanita Dr');
  let culN = 0;
  const culNames = ['Ct', 'Pl', 'Cir', 'Way'];
  const treeNames = ['Sage', 'Manzanita', 'Laurel', 'Oak Glen', 'Wren', 'Quail', 'Sumac', 'Agave', 'Cholla', 'Rancho', 'Vista', 'Mesa', 'Sierra', 'Canyon', 'Arbor', 'Willow', 'Juniper', 'Coyote', 'Hawk', 'Buckeye', 'Pepper', 'Olive', 'Citrus', 'Avocado', 'Lemon', 'Orchard', 'Sunrise', 'Sunset', 'Starlight', 'Shadow', 'Ridge', 'Meadow', 'Brook', 'Stone', 'Granite', 'Cobble', 'Pebble', 'Adobe', 'Mission', 'Padre', 'Cuyama', 'Kumeyaay'];
  for (const par of sproutFrom) {
    const L = polyLen(par.pts);
    for (let s = 46 + rnd() * 20; s < L - 46; s += 64 + rnd() * 34) {
      for (const side of [1, -1]) {
        if (rnd() < 0.18) continue;
        const a = along(par.pts, s);
        let dx = -a.tz * side, dz = a.tx * side;
        const bend = (rnd() - 0.5) * 0.5;
        const len = 70 + rnd() * 70;
        const pts = [[a.x, a.z]];
        let ok = 0;
        let x = a.x, z = a.z, ang = Math.atan2(dz, dx);
        for (let k = 1; k <= Math.floor(len / 12); k++) {
          ang += bend * 0.15;
          x += Math.cos(ang) * 12; z += Math.sin(ang) * 12;
          const zone = zoneOf(x, z);
          const gap = roadGap(x, z, 70, (r) => r === par);
          const cul0 = roadGap(x, z, 70, (r) => !r.cul);
          if (!zone || zone.style === 'mobile' || inWater(x, z) || riverDist(x, z) < RIVER_HALF + 30 || railGap(x) < 30) break;
          if (k * 12 > 24 && gap < 36) break;
          if (cul0 < 0) break;
          if (height(x, z) > 0.4) break;
          pts.push([x, z]); ok = k;
        }
        if (ok * 12 < 48) continue;
        // keep a ring free for the bulb
        const end = pts[pts.length - 1];
        if (roadGap(end[0], end[1], 70, (r) => r === par) < 40) { pts.pop(); if (pts.length < 5) continue; }
        culN++;
        const nm = `${treeNames[culN % treeNames.length]} ${culNames[(culN * 7) % culNames.length]}`;
        const r = addRoad({ name: nm, kind: 'street', width: 9, pts, res: true, cul: true, parent: par });
        culs.push(r);
      }
    }
  }
  // Weston's own short courts get bulbs too
  for (const nm of ['Toyon Pl', 'Boulder Way', 'Sandstone Ct', 'Talus Ct', 'Lake Canyon Rd', 'Riverpark Dr', 'Magnolia Hills Dr', 'Olive Ln']) {
    const r = byName.get(nm); if (r) { r.cul = true; culs.push(r); }
  }
  for (const r of culs) {
    const e = r.pts[r.pts.length - 1];
    const poly = ellipse(e[0], e[1], 13, 13, 14);
    open.push({ kind: 'lot', poly });
    deco.bulbs.push({ x: e[0], z: e[1], r: 13 });
  }

  // ── 6. escape paths from cul-de-sac ends ───────────────────────────────────────────────────────
  let paths = 0;
  for (const r of culs) {
    const e = r.pts[r.pts.length - 1];
    const prev = r.pts[r.pts.length - 2];
    let best = null;
    segGrid.query(e[0] - 110, e[1] - 110, e[0] + 110, e[1] + 110, (s) => {
      if (s.r === r || s.r === r.parent || s.r.kind === 'highway' || s.r.kind === 'ramp' || s.r.bridge) return;
      const dx = s.bx - s.ax, dz = s.bz - s.az, l2 = dx * dx + dz * dz;
      const t = clamp(((e[0] - s.ax) * dx + (e[1] - s.az) * dz) / l2, 0, 1);
      const qx = s.ax + dx * t, qz = s.az + dz * t;
      const d = Math.hypot(qx - e[0], qz - e[1]);
      // must lead roughly onward (not back along the cul-de-sac)
      const fwd = ((qx - e[0]) * (e[0] - prev[0]) + (qz - e[1]) * (e[1] - prev[1])) / (d * Math.hypot(e[0] - prev[0], e[1] - prev[1]) + 1e-6);
      if (fwd < -0.2) return;
      if (d > 15 && d < 105 && (!best || d < best.d)) best = { d, q: [qx, qz] };
    });
    if (!best) continue;
    // check the straight line stays dry, flat and off the rail
    let clear = true;
    const n = Math.ceil(best.d / 8);
    for (let k = 1; k < n; k++) {
      const x = e[0] + ((best.q[0] - e[0]) * k) / n, z = e[1] + ((best.q[1] - e[1]) * k) / n;
      if (inWater(x, z) || height(x, z) > 1.5 || railGap(x) < 2 || riverDist(x, z) < RIVER_HALF) { clear = false; break; }
    }
    if (!clear) continue;
    const pts = [e];
    for (let k = 1; k <= n; k++) pts.push([e[0] + ((best.q[0] - e[0]) * k) / n, e[1] + ((best.q[1] - e[1]) * k) / n]);
    addRoad({ name: `${r.name} path`, kind: 'alley', width: 5, pts, path: true });
    r.escape = true;
    paths++;
  }
  deco.stats = { culs: culs.length, paths };

  T('7. solids help'); yield;
  // ── 7. solids helpers ──────────────────────────────────────────────────────────────────────────
  const solidGrid = new Grid(40);
  function blocked(o, pad = 1) {
    let hit = false;
    const r = Math.hypot(o.w, o.d) / 2 + pad + 2;
    solidGrid.query(o.x - r - 20, o.z - r - 20, o.x + r + 20, o.z + r + 20, (w) => { if (obbHit(o, w.s, pad)) { hit = true; return false; } });
    return hit;
  }
  function addSolid(s) {
    solids.push(s);
    const r = Math.hypot(s.w, s.d) / 2;
    solidGrid.add({ s }, s.x - r, s.z - r, s.x + r, s.z + r);
    return s;
  }
  const corners = (o, grow = 0) => rectPoly(o.x, o.z, o.w + grow, o.d + grow, o.rot);
  function clearOfRoads(o, margin) {
    const pts = corners(o).concat([[o.x, o.z]]);
    // also edge midpoints
    const c = corners(o);
    for (let i = 0; i < 4; i++) pts.push([(c[i][0] + c[(i + 1) % 4][0]) / 2, (c[i][1] + c[(i + 1) % 4][1]) / 2]);
    for (const [x, z] of pts) {
      const g = roadGap(x, z, Math.max(20, margin + 16));
      if (g < margin) return false;
    }
    return true;
  }
  // engine-drawn props never stand inside a (smoothed) road ribbon
  const prop = (kind, style, x, z, h, color, sz = 0.8) => (roadGap(x, z, 30, (r) => r.bridge) < 0.4 ? null : addSolid({ kind, style, x: Math.round(x * 10) / 10, z: Math.round(z * 10) / 10, w: sz, d: sz, rot: 0, h, color }));
  const TREES = [
    ['palm', '#5f8a3a', 14, 0.7], ['palm', '#6a9440', 17, 0.7], ['jacaranda', '#9a7fd6', 7.5, 0.9], ['jacaranda', '#a58ae0', 6.5, 0.9],
    ['cottonwood', '#7a9a4a', 9, 1.0], ['pine', '#4f7a4a', 11, 1.0], ['shrub', '#7f9654', 2.2, 1.4],
  ];
  const pickTree = (bias) => {
    const r = rnd();
    if (r < bias.palm) return TREES[rnd() < 0.6 ? 0 : 1];
    if (r < bias.palm + bias.jac) return TREES[rnd() < 0.5 ? 2 : 3];
    if (r < bias.palm + bias.jac + 0.15) return TREES[5];
    if (r < bias.palm + bias.jac + 0.23) return TREES[6];
    return TREES[4];
  };
  const addTree = (x, z, bias = { palm: 0.3, jac: 0.25 }, scale = 1) => {
    const t = pickTree(bias);
    const o = { x, z, w: t[3], d: t[3], rot: 0 };
    if (blocked(o, 0.6)) return null;
    return prop(t[0] === 'shrub' ? 'shrub' : 'tree', t[0], x, z, Math.round(t[2] * scale * (0.85 + rnd() * 0.3) * 10) / 10, t[1], t[3]);
  };

  // ── 8. commercial centres ──────────────────────────────────────────────────────────────────────
  function centerRot(c) {
    if (c.rotTo) { const n = nearestOn(c.rotTo, c.x, c.z); const a = along(n.r.pts, n.s); return Math.atan2(-a.tz, a.tx) + (c.face === 'S' ? 0 : PI); }
    return c.face === 'S' ? 0 : PI;
  }
  function centerPoly(c) { return rectPoly(c.x, c.z, c.w, c.d, centerRot(c)); }
  function schoolRot(s) { if (s.rotTo) { const n = nearestOn(s.rotTo, s.x, s.z); const a = along(n.r.pts, n.s); return Math.atan2(-a.tz, a.tx); } return s.rot || 0; }
  // local frame helper: u = along street (local +x), v = away from street (local -z for face S?)
  function frame(x, z, rot) { const c = Math.cos(rot), s = Math.sin(rot); return (lx, lz) => [x + c * lx + s * lz, z - s * lx + c * lz]; }

  for (const c of CENTERS) {
    const rot = centerRot(c);
    const F = frame(c.x, c.z, rot);
    // local +z points to the street when face is 'S' with rot 0 (street is to the south, +z)
    const back = -c.d / 2; // far side from the street
    open.push({ kind: 'lot', poly: centerPoly(c) });
    deco.lots = deco.lots || [];
    deco.lots.push({ x: c.x, z: c.z, w: c.w, d: c.d, rot, stripes: !c.storage });
    if (c.big) {
      const bw = c.w * 0.72, bd = 46;
      const [bx, bz] = F(0, back + bd / 2 + 4);
      const b = addSolid({ kind: 'building', x: bx, z: bz, w: bw, d: bd, rot, h: 11, drawn: true });
      deco.bigs.push({ ...b, sign: c.shops[0], color: '#e9dcc4', trim: '#2d6fa8' });
      continue;
    }
    if (c.storage) {
      for (let k = 0; k < 4; k++) {
        const [bx, bz] = F(0, back + 10 + k * 20);
        const b = addSolid({ kind: 'building', x: bx, z: bz, w: c.w * 0.86, d: 9, rot, h: 3.4, drawn: true });
        deco.shops.push({ ...b, color: '#efe7d8', roof: '#c4583a', trim: '#c4583a', sign: k === 3 ? c.shops[0] : null, storage: true });
      }
      continue;
    }
    // inline strip along the back, gas station / pad on the street corner
    const shops = c.shops.filter((s) => s !== 'GAS');
    const gas = c.shops.includes('GAS');
    const usable = c.w - (gas ? 70 : 10);
    const x0 = -c.w / 2 + (gas && c.x > 0 ? 66 : 6);
    const sw = usable / Math.max(1, shops.length);
    const depth = Math.min(22, c.d * 0.3);
    shops.forEach((name, k) => {
      const lx = x0 + sw * (k + 0.5);
      const [bx, bz] = F(lx, back + depth / 2 + 3);
      const h = 6 + (k % 3 === 1 ? 1.5 : 0);
      if (!clearOfRoads({ x: bx, z: bz, w: sw - 1, d: depth, rot }, 1.5)) return;
      const b = addSolid({ kind: 'building', x: bx, z: bz, w: sw - 1, d: depth, rot, h, drawn: true });
      const pal = [['#ecdcc0', '#b5472f'], ['#f1e6d2', '#2f7f7a'], ['#e7cfa8', '#7a4b9a'], ['#f3ead8', '#c46a2a']][k % 4];
      deco.shops.push({ ...b, color: pal[0], trim: pal[1], sign: name, tile: k % 2 === 0 });
    });
    if (gas) {
      const lx = c.x > 0 ? -c.w / 2 + 34 : c.w / 2 - 34;
      const [gx, gz] = F(lx, c.d / 2 - 30);
      const can = addSolid({ kind: 'building', x: gx, z: gz, w: 26, d: 14, rot, h: 5.6, drawn: true, canopy: true });
      deco.misc.push({ type: 'canopy', ...can });
      // pumps under the canopy are bollards
      for (const px of [-7, 0, 7]) { const [qx, qz] = F(lx + px, c.d / 2 - 30); prop('bollard', 'bollard', qx, qz, 1.6, '#d9483b', 0.9); }
      const [kx, kz] = F(lx, back + 14);
      const kiosk = addSolid({ kind: 'building', x: kx, z: kz, w: 14, d: 10, rot, h: 4.5, drawn: true });
      deco.shops.push({ ...kiosk, color: '#f4f0e6', trim: '#d9483b', sign: 'GAS' });
      // the price sign by the street
      const [sx, sz] = F(c.x > 0 ? -c.w / 2 + 6 : c.w / 2 - 6, c.d / 2 - 4);
      prop('sign', 'sign', sx, sz, 6, '#d9483b', 0.6);
    }
    // lot light poles
    for (let lx = -c.w / 2 + 30; lx < c.w / 2 - 20; lx += 46) {
      const [px, pz] = F(lx, 6);
      prop('pole', 'lamp', px, pz, 9, '#6d6f73', 0.5);
    }
    // a couple of palms at the entrances
    for (const lx of [-c.w / 2 + 8, c.w / 2 - 8]) { const [px, pz] = F(lx, c.d / 2 - 4); addTree(px, pz, { palm: 1, jac: 0 }, 1.1); }
    if (c.trolley) deco.trolleyCenter = { x: c.x, z: c.z, rot };
  }

  // ── 9. the trolley: tracks, platform, the red cars, the viaduct over SR-52 ──────────────────────
  {
    const zTop = -118, zMG = 0, zBot = BOUNDS.z1;
    deco.rail = { x: TRACK_X, z0: zTop, z1: zBot };
    // track bed is drivable dirt (you can bump along the ballast) except on the viaduct
    open.push({ kind: 'dirt', poly: [[TRACK_X - 4, zTop], [TRACK_X + 4, zTop], [TRACK_X + 4, 420], [TRACK_X - 4, 420]] });
    // platform: a long low solid with a canopy
    const plat = addSolid({ kind: 'building', x: TRACK_X + 8.5, z: -70, w: 6, d: 80, rot: 0, h: 1.0, drawn: true });
    deco.trolley = { platform: plat, cars: [] };
    // two coupled red LRVs parked at the platform (solid)
    for (const [k, cz] of [[0, -88], [1, -59]]) {
      const car = addSolid({ kind: 'building', x: TRACK_X, z: cz, w: 3, d: 27, rot: 0, h: 3.9, drawn: true });
      deco.trolley.cars.push({ ...car, k });
    }
    // buffer stop
    addSolid({ kind: 'barrier', x: TRACK_X, z: zTop - 2, w: 4, d: 1.2, rot: 0, h: 1.3, drawn: true });
    deco.trolley.buffer = { x: TRACK_X, z: zTop - 2 };
    // catenary poles every 40 m (breakable)
    for (let z = zTop + 10; z < zBot; z += 40) {
      if (z > 440 && z < 560) continue; // viaduct
      if (Math.abs(z - zMG) < 16 || Math.abs(z - 248) < 12 || Math.abs(z - 162) < 10 || Math.abs(z - 362) < 10) continue;
      prop('pole', 'pole', TRACK_X + 4.5, z, 7.5, '#5d6066', 0.4);
    }
    // viaduct piers either side of the freeway (drawn)
    for (const pz of [454, 508]) addSolid({ kind: 'building', x: TRACK_X, z: pz, w: 4, d: 3, rot: 0, h: 7, drawn: true });
    deco.trolley.viaduct = { z0: 430, z1: 570, y: 7.2 };
  }

  // ── 10. schools, parks, airport ────────────────────────────────────────────────────────────────
  for (const s of SCHOOLS) {
    const rot = schoolRot(s);
    const F = frame(s.x, s.z, rot);
    open.push({ kind: 'lot', poly: rectPoly(...F(-s.w / 4, -s.d / 2 + 22), s.w / 2 - 4, 40, rot) });
    open.push({ kind: 'grass', poly: rectPoly(...F(s.w / 4, 0), s.w / 2 - 6, s.d - 10, rot) });
    deco.fields.push({ x: F(s.w / 4, 0)[0], z: F(s.w / 4, 0)[1], w: s.w / 2 - 6, d: s.d - 10, rot, track: true, color: s.color });
    // classroom wings
    for (const [lx, lz, w, d] of [[-s.w / 4, 10, s.w / 2 - 14, 18], [-s.w / 4 - 20, 44, 40, 22], [-s.w / 4 + 24, 44, 30, 22]]) {
      const [bx, bz] = F(lx, lz);
      const b = addSolid({ kind: 'building', x: bx, z: bz, w, d, rot, h: 7, drawn: true });
      deco.shops.push({ ...b, color: '#e8dcc6', trim: s.color, sign: lx === -s.w / 4 ? s.name.toUpperCase() : null, school: true });
    }
    // stadium lights
    for (const [lx, lz] of [[s.w / 4 - 40, -s.d / 2 + 8], [s.w / 4 + 40, -s.d / 2 + 8], [s.w / 4 - 40, s.d / 2 - 8], [s.w / 4 + 40, s.d / 2 - 8]]) { const [px, pz] = F(lx, lz); prop('pole', 'lamp', px, pz, 16, '#7a7d82', 0.6); }
  }
  for (const p of PARKS) {
    open.push({ kind: 'grass', poly: p.poly });
    if (p.fields) {
      const b = polyBox(p.poly);
      deco.fields.push({ x: (b.x0 + b.x1) / 2 - 90, z: (b.z0 + b.z1) / 2, w: 110, d: 70, rot: 0, color: '#2f7f7a' });
      deco.fields.push({ x: (b.x0 + b.x1) / 2 + 80, z: (b.z0 + b.z1) / 2, w: 110, d: 70, rot: 0, color: '#2f7f7a' });
      for (let x = b.x0 + 20; x < b.x1; x += 60) { prop('pole', 'lamp', x, b.z0 + 6, 14, '#7a7d82', 0.5); prop('pole', 'lamp', x, b.z1 - 6, 14, '#7a7d82', 0.5); }
    }
    const b = polyBox(p.poly);
    const n = Math.floor(((b.x1 - b.x0) * (b.z1 - b.z0)) / (p.golf ? 2000 : 2800));
    for (let k = 0; k < n; k++) {
      const x = b.x0 + rnd() * (b.x1 - b.x0), z = b.z0 + rnd() * (b.z1 - b.z0);
      if (!pip(p.poly, x, z) || roadGap(x, z) < 4 || inWater(x, z)) continue;
      if (p.fields && Math.abs(z - (b.z0 + b.z1) / 2) < 40) continue;
      addTree(x, z, p.golf ? { palm: 0.35, jac: 0.1 } : { palm: 0.25, jac: 0.3 });
    }
  }
  open.push({ kind: 'lot', poly: AIRPORT.poly });
  deco.airport = AIRPORT;
  for (let k = 0; k < 5; k++) {
    const hx = 100 + k * 115, hz = 626;
    const b = addSolid({ kind: 'building', x: hx, z: hz, w: 70, d: 24, rot: PI, h: 9, drawn: true });
    deco.bigs.push({ ...b, hangar: true, color: '#dfe2e2', trim: '#3e6f97', sign: k === 2 ? 'GILLESPIE FIELD' : null });
  }
  for (let k = 0; k < 7; k++) deco.misc.push({ type: 'plane', x: 70 + k * 80, z: 588 + (k % 2) * 6, rot: (k % 3) * 0.4 - 0.4 });
  for (let k = 0; k < 7; k++) addSolid({ kind: 'barrier', x: 70 + k * 80, z: 588 + (k % 2) * 6, w: 8, d: 7, rot: (k % 3) * 0.4 - 0.4, h: 2, drawn: true });

  // ── 11. Santee Lakes ───────────────────────────────────────────────────────────────────────────
  for (const p of lakePolys) water.push({ poly: p.map(([x, z]) => [Math.round(x * 10) / 10, Math.round(z * 10) / 10]) });
  deco.lakePark = [[-905, -520], [-1072, -525], [-1078, -1150], [-905, -1150]];
  // no open poly here: default ground is grass, and an open poly would hide the lakes' water
  deco.lakes = lakePolys;
  for (let k = 0; k < 80; k++) {
    const x = -1072 + rnd() * 165, z = -1145 + rnd() * 620;
    if (inWater(x, z) || roadGap(x, z) < 3) continue;
    let nearLake = false;
    for (const p of lakePolys) { const b = polyBox(p); if (x > b.x0 - 14 && x < b.x1 + 14 && z > b.z0 - 14 && z < b.z1 + 14) nearLake = true; }
    if (nearLake && rnd() < 0.5) continue;
    addTree(x, z, { palm: 0.2, jac: 0.05 }, 1.05);
  }
  // campground RVs at the north end
  for (let k = 0; k < 8; k++) {
    const x = -935 - (k % 2) * 12, z = -1100 + Math.floor(k / 2) * 16;
    if (roadGap(x, z) < 3) continue;
    const b = addSolid({ kind: 'building', x, z, w: 3, d: 9, rot: 0.2, h: 3.4, drawn: true });
    deco.misc.push({ type: 'rv', ...b });
  }

  // ── 12. river: sand, pools, reeds and cottonwoods ──────────────────────────────────────────────
  {
    const pts = resample(RIVER, 20);
    for (let i = 0; i < pts.length - 1; i += 6) {
      const seg = pts.slice(i, Math.min(pts.length, i + 7));
      if (seg.length < 2) break;
      open.push({ kind: 'sand', poly: ribbon(seg, (k) => RIVER_HALF + 2 * Math.sin((i + k) * 1.7)) });
    }
    for (const p of poolPolys) water.push({ poly: p.map(([x, z]) => [Math.round(x * 10) / 10, Math.round(z * 10) / 10]) });
    deco.pools = poolPolys;
    const L = polyLen(RIVER);
    for (let s = 10; s < L; s += 6) {
      const a = along(RIVER, s);
      for (const side of [-1, 1]) {
        const off = side * (RIVER_HALF - 2 - rnd() * 8);
        const x = a.x - a.tz * off, z = a.z + a.tx * off;
        if (roadGap(x, z) < 6 || inWater(x, z)) continue;
        if (rnd() < 0.8) deco.reeds.push([x, z, 1.4 + rnd() * 1.8]);
        else if (rnd() < 0.08) { const o = { x: x + side * 4, z, w: 1.1, d: 1.1, rot: 0 }; if (!blocked(o, 0.6)) prop('tree', rnd() < 0.8 ? 'cottonwood' : 'palm', o.x, z, rnd() < 0.8 ? 9 + rnd() * 3 : 13, rnd() < 0.5 ? '#86a24e' : '#7a9a4a', 1.1); }
      }
      // a few islands of willow in the channel: obstacles to weave through
      if (rnd() < 0.05) { const x = a.x + (rnd() - 0.5) * 14, z = a.z + (rnd() - 0.5) * 14; if (roadGap(x, z) > 8 && !inWater(x, z)) prop('tree', 'cottonwood', x, z, 8 + rnd() * 3, '#86a24e', 1.2); }
    }

      for (const [px, pz] of [[-m.w / 2 + 2, -m.d / 2 + 2], [m.w / 2 - 2, -m.d / 2 + 2], [-m.w / 2 + 2, m.d / 2 - 2], [m.w / 2 - 2, m.d / 2 - 2]]) box(B, frame(...F(px, 0, pz), m.rot), 0.5, 4.6, 0.5, C('#e8e4dc'), null);
    } else if (m.type === 'plane') {
      const F = frame(m.x, 0, m.z, m.rot);
      box(B, F, 1.2, 1.2, 7, C('#f4f4f2'), C('#ffffff'), 0.6);
      box(B, frame(...F(0, 1.5, -0.6), m.rot), 9, 0.15, 1.4, C('#f4f4f2'), C('#ffffff'));
      box(B, frame(...F(0, 1.8, 3.1), m.rot), 0.15, 1.4, 0.9, C('#c8102e'), C('#c8102e'));
      box(B, frame(...F(0, 0.7, -3.6), m.rot), 0.3, 0.6, 0.3, C('#333333'), null);
    } else if (m.type === 'rv') {
      const F = frame(m.x, 0, m.z, m.rot);
      box(B, F, m.w, m.h, m.d, C('#f3f1ea'), C('#ffffff'), 0.3);
      facePatch(B, frame(m.x, 0, m.z, m.rot + Math.PI / 2), -m.d / 2, m.d / 2, 1.6, 1.9, -m.w / 2 - 0.02, C('#8a5a3a'));
    }
  }
  // airport runway paint
  {
    const B = get(330, 600).B;
    for (let x = 0; x < 660; x += 26) B.quad([x, 0.08, 570], [x, 0.08, 571], [x + 14, 0.08, 571], [x + 14, 0.08, 570], STRIPE);
  }
  yield;

  // ── walls, rocks, scrub, reeds ─────────────────────────────────────────────────────────────────
  let wn = 0;
  for (const w of deco.walls) {
    if (++wn % 200 === 0) yield;
    const { B } = get(w.x, w.z);
    const col = C(w.color);
    const y0 = Math.min(H(w.x, w.z), 0);
    box(B, frame(w.x, y0, w.z, w.rot), w.w, w.h - y0, w.d, col, mul(col, 1.1));
    if (!low && !w.sound) box(B, frame(w.x, 0, w.z, w.rot), w.w + 0.05, 0.12, w.d + 0.16, mul(col, 1.12), mul(col, 1.15), w.h);
  }
  for (const r of deco.rocks) blob(get(r.x, r.z).B, r.x, r.y - 0.3, r.z, r.w / 2, r.h, r.d / 2, mix(C('#b8a78e'), C('#8f8577'), rnd()), rnd, 6);
  if (!low) {
    const SC = [C('#7d8a52'), C('#6a7646'), C('#93975c'), C('#a39a63')];
    let sn = 0;
    for (const [x, z, s, t] of deco.scrub) { if (++sn % 300 === 0) yield; const y = H(x, z); blob(get(x, z).B, x, y - 0.2, z, s, s * 0.9, s * 0.9, SC[Math.floor(t * 4)], rnd, high ? 5 : 4); }
    const RE = [C('#a7a35a'), C('#8b9a4c'), C('#b9a868')];
    let rn = 0;
    for (const [x, z, h] of deco.reeds) {
      if (++rn % 300 === 0) yield;
      const y = H(x, z) - 0.05, B = get(x, z).B, col = RE[Math.floor(rnd() * 3)];
      for (let k = 0; k < 3; k++) { // a tuft of three leaning blades (two-sided)
        const a = rnd() * Math.PI, c = Math.cos(a) * 0.5, s2 = Math.sin(a) * 0.5, lx = (rnd() - 0.5) * 0.8, lz = (rnd() - 0.5) * 0.8;
        const p0 = [x - c, y, z - s2], p1 = [x + c, y, z + s2], tip = [x + lx, y + h * (0.7 + rnd() * 0.5), z + lz];
        B.tri(p0, tip, p1, col); B.tri(p1, tip, p0, mul(col, 0.85));
      }
    }
  }
  yield;

  // riparian willow scrub along the river banks (visual only, not solid)
  if (!low) {
    const RIP = [C('#6f8f45'), C('#5f7f3c'), C('#7d9a50')];
    const Lr = polyLen(RIVER);
    for (let sd = 8; sd < Lr; sd += high ? 7 : 11) {
      const a = along(RIVER, sd);
      for (const side of [-1, 1]) {
        if (rnd() < 0.35) continue;
        const off = side * (RIVER_HALF + 1 + rnd() * 6);
        const x = a.x - a.tz * off, z = a.z + a.tx * off;
        if (L.roadGap(x, z, 20) < 3 || L.inWater(x, z)) continue;
        const sz = 1.4 + rnd() * 1.8;
        blob(get(x, z).B, x, H(x, z) - 0.2, z, sz, sz * (1.6 + rnd() * 0.8), sz, RIP[Math.floor(rnd() * 3)], rnd, 5);
      }
    }
  }
  yield;

  // ── the trolley: rails, platform, red cars, viaduct over SR-52 ─────────────────────────────────
  {
    const tr = deco.trolley, rail = deco.rail;
    const RAILC = C('#5c5650'), BALLAST = C('#8f8578'), TIE = C('#6b5a48');
    for (let z = rail.z0; z < rail.z1; z += 20) {
      const za = z, zb = Math.min(z + 20, rail.z1);
      const onV = za >= tr.viaduct.z0 && zb <= tr.viaduct.z1;
      const y = onV ? tr.viaduct.y : 0.09;
      const B = get(rail.x, za + 1).B;
      B.quad([rail.x - 2.4, y, za], [rail.x - 2.4, y, zb], [rail.x + 2.4, y, zb], [rail.x + 2.4, y, za], BALLAST);
      if (!low) for (let t = za; t < zb; t += 2.5) B.quad([rail.x - 1.3, y + 0.02, t], [rail.x - 1.3, y + 0.02, t + 0.5], [rail.x + 1.3, y + 0.02, t + 0.5], [rail.x + 1.3, y + 0.02, t], TIE);
      for (const rx of [-0.72, 0.72]) box(B, frame(rail.x + rx, y, (za + zb) / 2, 0), 0.14, 0.18, zb - za, RAILC, C('#9a948c'));
      if (onV) box(B, frame(rail.x, y - 1.2, (za + zb) / 2, 0), 6, 1.2, zb - za, C('#cfc8bb'), null);
    }
    // ramps up to the viaduct
    for (const [zA, zB] of [[tr.viaduct.z0 - 60, tr.viaduct.z0], [tr.viaduct.z1, tr.viaduct.z1 + 60]]) {
      const B = get(rail.x, zA).B;
      const up = zA < tr.viaduct.z0;
      const yA = up ? 0.1 : tr.viaduct.y, yB = up ? tr.viaduct.y : 0.1;
      B.quad([rail.x - 3, yA, zA], [rail.x - 3, yB, zB], [rail.x + 3, yB, zB], [rail.x + 3, yA, zA], C('#cfc8bb'));
      B.quad([rail.x - 3, 0, zA], [rail.x - 3, 0, zB], [rail.x - 3, yB, zB], [rail.x - 3, yA, zA], C('#bdb5a7'));
      B.quad([rail.x + 3, yA, zA], [rail.x + 3, yB, zB], [rail.x + 3, 0, zB], [rail.x + 3, 0, zA], C('#bdb5a7'));
    }
    for (const pz of [454, 508]) box(get(rail.x, pz).B, frame(rail.x, 0, pz, 0), 4, tr.viaduct.y - 1.2, 3, C('#bdb5a7'), null);
    // platform with canopy
    const p = tr.platform;
    const { B, S } = get(p.x, p.z);
    box(B, frame(p.x, 0, p.z, 0), p.w, p.h, p.d, C('#d8d2c6'), C('#e9e4da'));
    box(B, frame(p.x - p.w / 2 + 0.2, p.h, p.z, 0), 0.25, 0.02, p.d, C('#f2c230'), C('#f2c230'));
    for (let z = p.z - p.d / 2 + 6; z < p.z + p.d / 2; z += 12) box(B, frame(p.x + 1.4, p.h, z, 0), 0.25, 3.4, 0.25, C('#c8102e'), null);
    box(B, frame(p.x + 0.6, p.h + 3.4, p.z, 0), 4.4, 0.35, p.d - 8, C('#c8102e'), C('#e5e1d8'));
    sign(S, frame(p.x + 2.8, 0, p.z, Math.PI / 2), 0, p.h + 4.6, -0.05, 14, 'SANTEE TROLLEY SQUARE');
    sign(S, frame(p.x + 2.8, 0, p.z, -Math.PI / 2), 0, p.h + 4.6, -0.05, 14, 'SANTEE TROLLEY SQUARE');
    // the red LRVs
    for (const c of tr.cars) {
      const { B } = get(c.x, c.z);
      const F = frame(c.x, 0.5, c.z, 0);
      box(B, F, c.w, c.h - 0.5, c.d, C('#c8102e'), C('#d9d6cf'));
      box(B, frame(c.x, 2.05, c.z, 0), c.w + 0.04, 1.1, c.d - 1.2, C('#2c3440'), null);
      box(B, frame(c.x, 0.5, c.z, 0), c.w + 0.05, 0.35, c.d + 0.02, C('#e9e6df'), null);
      box(B, frame(c.x, c.h, c.z, 0), 1.4, 0.6, 2.6, C('#4a4d52'), null); // pantograph base
      B.tri([c.x - 0.6, c.h + 0.6, c.z - 0.8], [c.x, c.h + 1.8, c.z], [c.x + 0.6, c.h + 0.6, c.z + 0.8], C('#3a3c40'));
    }
    // overhead wire (thin dark strip) above the tracks
    for (let z = rail.z0 + 10; z < rail.z1 - 10; z += 40) {
      const y = (z > tr.viaduct.z0 - 30 && z < tr.viaduct.z1 + 30) ? tr.viaduct.y + 6 : 6.8;
      if (!low) box(get(rail.x, z).B, frame(rail.x, y, z + 20, 0), 0.05, 0.05, 40, C('#2b2b2b'), null);
    }
  }

  // ── signs: pylons, gantries, monuments ──────────────────────────────────────────────────────────
  for (const p of deco.pylons || []) {
    const { B, S } = get(p.x, p.z);
    const F = frame(p.x, 0, p.z, p.rot + Math.PI);
    box(B, F, 0.8, 8.2, 0.8, C('#d8c3a0'), null);
    box(B, frame(p.x, 4.4, p.z, p.rot + Math.PI), 6.6, 3.6, 0.7, C('#e9dcc4'), C('#c8623e'));
    p.names.forEach((n, k) => { sign(S, F, 0, 7.3 - k * 1.05, -0.37, 6.2, n); sign(S, frame(p.x, 0, p.z, p.rot), 0, 7.3 - k * 1.05, -0.37, 6.2, n); });
    gableRoof(B, frame(p.x, 0, p.z, p.rot), 7.0, 1.2, 8.0, 0.8, 0.1, C('#c8623e'), C('#e9dcc4'));
  }
  for (const g of deco.gantries || []) {
    const { B, S } = get(g.x, g.z);
    const F = frame(g.x, 0, g.z, g.rot);
    for (const sd of [-1, 1]) box(B, frame(...F(sd * g.span / 2, 0, 0), g.rot), 0.6, 7.6, 0.6, C('#8d9094'), C('#8d9094'));
    box(B, frame(...F(0, 6.4, 0), g.rot), g.span + 0.6, 0.5, 0.5, C('#8d9094'), C('#8d9094'));
    box(B, frame(...F(g.span / 4, 5.6, 0.3), g.rot), 9.4, 2.2, 0.2, C('#1b6e3a'), C('#1b6e3a'));
    sign(S, F, g.span / 4, 6.7, -0.02, 9, g.label);
  }
  for (const m of deco.monuments || []) {
    const { B, S } = get(m.x, m.z);
    const F = frame(m.x, 0, m.z, m.rot);
    box(B, F, 8, 2.0, 1.2, C(m.color), mul(C(m.color), 1.08));
    box(B, frame(m.x, 2.0, m.z, m.rot), 8.4, 0.4, 1.4, C('#c8623e'), C('#c8623e'));
    sign(S, F, 0, 1.15, -0.62, 7.2, m.label);
    sign(S, frame(m.x, 0, m.z, m.rot + Math.PI), 0, 1.15, -0.62, 7.2, m.label);
    if (!low) for (const sx of [-4.6, 4.6]) blob(B, ...F(sx, 0, -0.4), 0.9, 1.1, 0.7, C('#6f8a48'), rnd, 5);
  }

  // ── chunk meshes ───────────────────────────────────────────────────────────────────────────────
  let mat;
  if (kit.toon) { try { mat = kit.toon(null, { vertexColors: true }); } catch (e) { mat = null; } }
  if (!mat) mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  if (!mat.vertexColors) { mat.vertexColors = true; mat.needsUpdate = true; }
  const atlas = makeAtlas(THREE);
  const signMat = atlas ? new THREE.MeshBasicMaterial({ map: atlas, toneMapped: false }) : null;
  if (dark) { // dark mode is night: sink everything toward a cool dusk, keep the glows
    for (const c of chunks.values()) {
      const col = c.B.c, f = c.B.f;
      for (let v = 0, i = 0; i < col.length; i += 3, v++) {
        if (f[v] === 3) continue;
        col[i] = col[i] * 0.5 + 0.03; col[i + 1] = col[i + 1] * 0.52 + 0.04; col[i + 2] = col[i + 2] * 0.6 + 0.09;
      }
    }
  }
  let tris = 0, meshes = 0;
  let cn = 0;
  for (const c of chunks.values()) {
    if (++cn % 12 === 0) yield;
    const cx = c.i * CH + CH / 2, cz = c.j * CH + CH / 2;
    const parent = kit.chunk ? kit.chunk(cx, cz) : root;
    if (c.B.n) {
      const m = new THREE.Mesh(c.B.geometry(THREE), mat);
      m.name = `santee-${c.i},${c.j}`; m.matrixAutoUpdate = false; m.updateMatrix();
      m.receiveShadow = true;
      parent.add(m); tris += c.B.n; meshes++;
    }
    if (c.S.n && signMat) {
      const m = new THREE.Mesh(c.S.geometry(THREE), signMat);
      m.name = `santee-signs-${c.i},${c.j}`; m.matrixAutoUpdate = false; m.updateMatrix();
      parent.add(m); tris += c.S.n; meshes++;
    }
  }
  // cats at 8524 Boulder Way
  const home = deco.home;
  if (home) {
    const catGroup = makeCats(THREE, mat, deco.cats, home, L);
    (kit.chunk ? kit.chunk(home.x, home.z) : root).add(catGroup);
  }
  root.userData.stats = { tris, meshes, chunks: chunks.size };
  return root;
}

/** The home at 8524 Boulder Way: modern farmhouse with porch, house number, lit lamp, planters. */
function heroHouse(THREE, B, S, F, h) {
  const fz = -h.d / 2;
  const roof = C('#33373c'), white = C('#f6f4ef'), black = C('#202226'), wood = C('#9a6a3e');
  const gs = h.garage, ox = -gs * 2.2;
  // porch: slab, two posts, shed roof across the entry side
  const px0 = ox - 2.6, px1 = ox + 2.6;
  box(B, frame(...F((px0 + px1) / 2, 0, fz - 1.3), h.rot), px1 - px0, 0.25, 2.6, C('#cfc9bd'), C('#ddd7cb'));
  for (const x of [px0 + 0.3, px1 - 0.3]) box(B, frame(...F(x, 0.25, fz - 2.4), h.rot), 0.28, 2.75, 0.28, wood, null);
  const P = (lx, ly, lz) => F(lx, ly, lz);
  B.quad(P(px0 - 0.3, 3.0, fz - 2.8), P(px0 - 0.3, 3.5, fz), P(px1 + 0.3, 3.5, fz), P(px1 + 0.3, 3.0, fz - 2.8), roof);
  B.quad(P(px1 + 0.3, 2.85, fz - 2.8), P(px1 + 0.3, 3.0, fz - 2.8), P(px0 - 0.3, 3.0, fz - 2.8), P(px0 - 0.3, 2.85, fz - 2.8), black);
  // wood front door with black frame, windows with black frames and white mullions
  facePatch(B, F, ox - 0.65, ox + 0.65, 0.25, 2.45, fz - 0.03, black);
  facePatch(B, F, ox - 0.5, ox + 0.5, 0.25, 2.3, fz - 0.04, wood);
  for (const [cx, y0, y1] of [[ox - gs * 2.0, 1.0, 2.3], [-h.w / 4, 4.0, 5.6], [h.w / 4, 4.0, 5.6]]) {
    facePatch(B, F, cx - 0.95, cx + 0.95, y0 - 0.1, y1 + 0.1, fz - 0.03, black);
    if (B.night) B.fx = 3;
    facePatch(B, F, cx - 0.8, cx + 0.8, y0, y1, fz - 0.04, B.night ? C('#ffd98a') : C('#7fa6c9'));
    B.fx = 0;
    facePatch(B, F, cx - 0.04, cx + 0.04, y0, y1, fz - 0.05, white);
  }
  // porch lamp (warm), house number plaque, planters with lavender, welcome mat
  B.fx = 3;
  box(B, frame(...F(ox + 0.95, 1.9, fz - 0.12), h.rot), 0.22, 0.32, 0.18, C('#ffd27a'), C('#ffd27a'));
  B.fx = 0;
  sign(S, frame(...F(0, 0, 0), h.rot), ox + 1.6, 1.75, fz - 0.06, 1.6, '8524');
  for (const x of [px0 + 0.6, px1 - 0.6]) { box(B, frame(...F(x, 0.25, fz - 2.15), h.rot), 0.6, 0.6, 0.6, C('#c26a3e'), null); box(B, frame(...F(x, 0.85, fz - 2.15), h.rot), 0.5, 0.35, 0.5, C('#8a6fc2'), C('#9c82d2')); }
  box(B, frame(...F(ox, 0.26, fz - 0.6), h.rot), 1.1, 0.02, 0.6, C('#6b4a3a'), C('#6b4a3a'));
  // walkway from the porch to the driveway, and a low hedge along the lawn
  box(B, frame(...F(ox, 0, fz - 4.2), h.rot), 1.2, 0.06, 3.0, C('#d9d3c7'), C('#d9d3c7'));
  box(B, frame(...F(-gs * (h.w / 2 - 0.4), 0, fz - 3.5), h.rot), 0.7, 0.7, 4.5, C('#5f8a46'), C('#6f9a52'));
}

// ── far hills (fog-free) ─────────────────────────────────────────────────────────────────────────
// Peaks by real bearing from the Mission Gorge / Cuyamaca corner. dist = backdrop radius (m),
// h = height above the valley (exaggerated a little for readability), w = half-width (deg).
const PEAKS = [
  { name: 'Cowles Mtn', brg: 235, dist: 2300, h: 270, w: 9, rock: true },
  { name: 'Pyles Peak', brg: 245, dist: 2250, h: 150, w: 5 },
  { name: 'Kwaay Paay', brg: 254, dist: 2150, h: 120, w: 5 },
  { name: 'South Fortuna', brg: 266, dist: 2150, h: 150, w: 6 },
  { name: 'North Fortuna', brg: 277, dist: 2200, h: 155, w: 6 },
  { name: 'Fanita hills', brg: 330, dist: 2000, h: 110, w: 20 },
  { name: 'Iron Mtn', brg: 12, dist: 2600, h: 140, w: 9 },
  { name: 'Lakeside hills', brg: 52, dist: 2100, h: 105, w: 16 },
  { name: 'El Cajon Mtn', brg: 75, dist: 2900, h: 200, w: 10, rock: true },
  { name: 'Rattlesnake Mtn', brg: 105, dist: 2000, h: 95, w: 10 },
  { name: 'Mt Helix', brg: 168, dist: 2300, h: 110, w: 8 },
  { name: 'Grossmont', brg: 192, dist: 2200, h: 100, w: 9 },
];
function backdropSantee(THREE, kit, L) {
  const g = new THREE.Group();
  g.name = 'santee-backdrop';
  const rnd = prng(52);
  const B = new Buf();
  const cx = -250, cz = -300; // map centre
  const HAZE = C('#e6d6b8');
  const sunB = (252 * Math.PI) / 180, sunE = (24 * Math.PI) / 180;
  const SUN = [Math.sin(sunB) * Math.cos(sunE), Math.sin(sunE), -Math.cos(sunB) * Math.cos(sunE)];
  // baked toon-ish shading: 3 bands from the sun, then haze by distance
  const shade = (a, b, c, col, haze) => {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    if (ny < 0) { nx = -nx; ny = -ny; nz = -nz; }
    const d = nx * SUN[0] + ny * SUN[1] + nz * SUN[2];
    const k = d > 0.55 ? 1.12 : d > 0.15 ? 0.97 : 0.8;
    B.tri(a, b, c, mix(mul(col, k), HAZE, haze));
  };
  const toXZ = (brg, r) => { const a = (brg * Math.PI) / 180; return [cx + Math.sin(a) * r, cz - Math.cos(a) * r]; };
  const CHAP = [C('#7f8650'), C('#8c8a58'), C('#97905e'), C('#757d4c')];
  const ROCK = C('#bfb294');
  // continuous low ridge closing the horizon
  const N = 180;
  const ridge = (brg) => 34 + 12 * Math.sin(brg * 0.11) + 8 * Math.sin(brg * 0.37 + 1) + 4 * Math.sin(brg * 1.3);
  const ring = [];
  for (let i = 0; i <= N; i++) {
    const b = (i / N) * 360, r = 2450 + 110 * Math.sin(i * 0.7);
    const [x0, z0] = toXZ(b, r - 250), [x1, z1] = toXZ(b, r), [x2, z2] = toXZ(b, r + 450);
    ring.push([[x0, -6, z0], [x1, ridge(b), z1], [x2, ridge(b) * 0.4, z2]]);
  }
  for (let i = 0; i < N; i++) {
    const a = ring[i], b = ring[i + 1], col = CHAP[i % 4];
    shade(a[0], a[1], b[1], col, 0.42); shade(a[0], b[1], b[0], col, 0.42);
    shade(a[1], a[2], b[2], col, 0.48); shade(a[1], b[2], b[1], col, 0.48);
  }
  // the named peaks as domed mounds (rings at falling radius), in front of the ring
  const RINGS = [[1.0, -8], [0.74, 0.34], [0.46, 0.7], [0.2, 0.93]];
  for (const p of PEAKS) {
    const [px, pz] = toXZ(p.brg, p.dist);

    try { await navigator.share({ text, url }); return; } catch (e) { if (e.name === 'AbortError') return; }
